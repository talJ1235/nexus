<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Supermarket tab · phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nx.css">
<link rel="stylesheet" href="./nx16.css">
<link rel="stylesheet" href="./nx17.css">
<link rel="stylesheet" href="./nx18.css">
<link rel="stylesheet" href="./nx-sm.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="{{cls}}" dir="{{dir}}" lang="{{lang}}" style="width:390px;height:844px;font-family:'Heebo',system-ui,sans-serif">
<div class="phone">
  <div class="scroll" style="padding-bottom:{{padBottom}}">

    <div style="display:flex;align-items:center;gap:8px;padding:14px 20px 0">
      <span class="tile t22 gr-green"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span>
      <span class="sub bidi" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600">{{space}}</span>
      <span class="pile"><span class="av xs c3">{{iniT}}</span><span class="av xs c2">{{iniN}}</span><span class="av xs c4">{{iniY}}</span></span>
    </div>
    <div class="sm-head">
      <h1>{{t.title}}</h1>
      <sc-if value="{{offline}}" hint-placeholder-val="{{ false }}"><span class="stp off"><svg class="s" viewBox="0 0 24 24"><path d="M2 2l20 20 M17.5 17.5H7a5 5 0 0 1-1.3-9.8 M10 5.3A6 6 0 0 1 18 9h.5a3.5 3.5 0 0 1 2.4 6"></path></svg>{{t.offline}}</span></sc-if>
      <sc-if value="{{viewer}}" hint-placeholder-val="{{ false }}"><span class="stp view"><svg class="s" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path></svg>{{t.viewOnly}}</span></sc-if>
      <button class="{{moreCls}}" onClick="{{toggleMenu}}" aria-label="{{t.more}}" aria-expanded="{{menu}}"><svg class="s lg" viewBox="0 0 24 24" style="stroke-width:2.6"><path d="M5 12h.01 M12 12h.01 M19 12h.01"></path></svg></button>
    </div>

    <div style="padding:10px 16px 0">
      <div class="seg2" role="tablist" aria-label="{{t.title}}">
        <span class="pill" style="inset-inline-start:3px;width:calc(50% - 3px);transform:{{pillTf}}"></span>
        <button role="tab" class="{{tabListCls}}" aria-selected="{{onList}}" onClick="{{toList}}">{{t.list}}</button>
        <button role="tab" class="{{tabRecCls}}" aria-selected="{{onRec}}" onClick="{{toRec}}">{{t.recipes}}</button>
      </div>
    </div>

    <sc-if value="{{onList}}" hint-placeholder-val="{{ true }}">
      <div class="storebar">
        <button class="chip-s" aria-label="{{t.changeStore}}">
          <span class="chain ch-a">{{chainIni}}</span>
          <span class="nm"><b class="bidi">{{chain}}</b><span class="bidi">{{branch}}</span></span>
          <svg class="s sm" viewBox="0 0 24 24" style="color:var(--faint)"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
        <div class="est"><b>{{estimate}}</b><span class="{{emCls}}" aria-hidden="true"><i style="width:{{emW}}"></i></span><span>{{budgetLeft}}</span></div>
      </div>

      <sc-if value="{{hasList}}" hint-placeholder-val="{{ true }}"><div class="crail" role="img" aria-label="{{railLabel}}"><sc-for list="{{secs}}" as="sc" hint-placeholder-count="8"><i class="{{sc.kc}}" style="flex-grow:{{sc.count}}"></i></sc-for></div></sc-if>
      <sc-if value="{{canEdit}}" hint-placeholder-val="{{ true }}">
        <label class="addf">
          <svg class="s lead" viewBox="0 0 24 24"><path d="M12 5v14 M5 12h14"></path></svg>
          <input type="text" placeholder="{{t.addPh}}" enterkeyhint="done" autocomplete="off" aria-label="{{t.addPh}}">
          <button class="ico-b" aria-label="{{t.scan}}"><svg class="s" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2 M17 3h2a2 2 0 0 1 2 2v2 M21 17v2a2 2 0 0 1-2 2h-2 M7 21H5a2 2 0 0 1-2-2v-2 M7 8v8 M10 8v8 M13 8v8 M17 8v8"></path></svg></button>
          <button class="ico-b" aria-label="{{t.photo}}"><svg class="s" viewBox="0 0 24 24"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z M12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg></button>
          <button class="ico-b" aria-label="{{t.voice}}"><svg class="s" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z M5 11a7 7 0 0 0 14 0 M12 18v3"></path></svg></button>
          <button class="ico-b" aria-label="{{t.recipe}}"><svg class="s" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"></path></svg></button>
        </label>
      </sc-if>

      <sc-if value="{{first}}" hint-placeholder-val="{{ false }}">
        <div class="ft stg">
          <div class="ft-art brandband">
            <div class="aisle">
              <sc-for list="{{shelves}}" as="sh" hint-placeholder-count="5">
                <span class="shelf" style="height:{{sh.h}};animation-delay:{{sh.d}}"><svg viewBox="0 0 24 24"><path d="{{sh.p}}"></path></svg></span>
              </sc-for>
            </div>
          </div>
          <b style="font-size:20px;font-weight:800;letter-spacing:-.02em;padding:6px 4px 0">{{t.ftTitle}}</b>
          <button class="opt sm-press" onClick="{{start}}">
            <span class="ic" style="width:44px;height:44px;border-radius:13px"><svg class="s lg" viewBox="0 0 24 24"><path d="M5 10l2 10a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l2-10 M3 10h18 M8 10l3-6 M16 10l-3-6"></path></svg></span>
            <span class="tx"><b>{{t.basket}}</b><span>{{t.basketS}}</span></span>
            <svg class="s flip" viewBox="0 0 24 24" style="color:var(--faint)"><path d="m9 18 6-6-6-6"></path></svg>
          </button>
          <button class="opt sm-press" onClick="{{start}}">
            <span class="ic" style="width:44px;height:44px;border-radius:13px;background:var(--spark);color:#fff"><svg class="s lg" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg></span>
            <span class="tx"><b>{{t.build}}</b><span>{{t.buildS}}</span></span>
            <svg class="s flip" viewBox="0 0 24 24" style="color:var(--faint)"><path d="m9 18 6-6-6-6"></path></svg>
          </button>
          <button class="opt sm-press" onClick="{{start}}">
            <span class="ic" style="width:44px;height:44px;border-radius:13px"><svg class="s lg" viewBox="0 0 24 24"><path d="M9 3h6v3H9z M8 4H6a1 1 0 0 0-1 1v15a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-2"></path></svg></span>
            <span class="tx"><b>{{t.paste}}</b><span>{{t.pasteS}}</span></span>
            <svg class="s flip" viewBox="0 0 24 24" style="color:var(--faint)"><path d="m9 18 6-6-6-6"></path></svg>
          </button>
        </div>
      </sc-if>

      <sc-if value="{{showSug}}" hint-placeholder-val="{{ true }}">
        <section class="{{sugCls}}" aria-label="{{sugTitle}}">
          <button class="sug-h" onClick="{{toggleSug}}" aria-expanded="{{sugOpen}}">
            <span class="sp"><svg class="s sm" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg></span>
            <span class="tt"><b>{{sugTitle}}</b><span>{{sugSub}}</span></span>
            <svg class="s cv" viewBox="0 0 24 24" style="margin-inline-end:8px"><path d="m6 9 6 6 6-6"></path></svg>
          </button>
          <div class="sug-b"><div>
            <sc-for list="{{sugs}}" as="g" hint-placeholder-count="4">
              <div class="{{g.cls}}">
                <span class="{{g.tileCls}}"><sc-if value="{{g.art.has}}" hint-placeholder-val="{{ true }}"><svg class="art" viewBox="0 0 48 48" aria-hidden="true"><path d="{{g.art.d0}}" fill="{{g.art.f0}}"></path><path d="{{g.art.d1}}" fill="{{g.art.f1}}"></path><path d="{{g.art.d2}}" fill="{{g.art.f2}}"></path><path d="{{g.art.d3}}" fill="{{g.art.f3}}"></path><path d="{{g.art.d4}}" fill="{{g.art.f4}}"></path><path d="{{g.art.d5}}" fill="{{g.art.f5}}"></path></svg></sc-if><sc-if value="{{g.noArt}}" hint-placeholder-val="{{ false }}"><svg class="fb" viewBox="0 0 24 24" aria-hidden="true"><path d="{{g.secD}}"></path></svg></sc-if></span>
                <span class="tx"><b class="bidi">{{g.name}}</b><span class="why2"><svg viewBox="0 0 24 24" class="s xs"><path d="{{g.icon}}"></path></svg>{{g.why}}</span></span>
                <button class="mini" onClick="{{g.no}}" aria-label="{{g.noLabel}}"><svg class="s" viewBox="0 0 24 24"><path d="M18 6 6 18 M6 6l12 12"></path></svg></button>
                <button class="mini add" onClick="{{g.yes}}" aria-label="{{g.yesLabel}}"><svg class="s" viewBox="0 0 24 24" style="stroke-width:2.4"><path d="M12 5v14 M5 12h14"></path></svg></button>
              </div>
            </sc-for>
            <div class="sug-f">
              <span class="sub">{{t.sugFoot}}</span>
              <button class="btn sm pri" style="height:40px;border-radius:11px" onClick="{{acceptAll}}">{{t.addAll}}</button>
            </div>
          </div></div>
        </section>
      </sc-if>

      <sc-if value="{{hasList}}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:center;gap:8px;padding:16px 20px 2px">
          <b style="font-size:13px;color:var(--muted);font-weight:600;flex:1">{{countLine}}</b>
        </div>
        <sc-for list="{{secs}}" as="sc" hint-placeholder-count="5">
          <div class="{{sc.cls}}">
            <button class="sec-h" onClick="{{sc.toggle}}" aria-expanded="{{sc.open}}">
              <span class="{{sc.si}}"><svg viewBox="0 0 24 24"><path d="{{sc.d}}"></path></svg></span>
              <span class="nm">{{sc.name}}</span>
              <span class="n">{{sc.count}}</span>
              <svg class="s sm cv" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <div class="sec-b"><div class="{{boxCls}}">
              <sc-if value="{{tiles}}" hint-placeholder-val="{{ false }}"><div class="tgrid">
                <sc-for list="{{sc.rows}}" as="r" hint-placeholder-count="3">
                  <button class="{{r.tlCls}}" aria-label="{{r.aria}}"><span class="{{r.whoCls}}"></span><span class="tq">{{r.q}}</span><span class="{{r.tileClsL}}"><sc-if value="{{r.art.has}}" hint-placeholder-val="{{ true }}"><svg class="art" viewBox="0 0 48 48" aria-hidden="true"><path d="{{r.art.d0}}" fill="{{r.art.f0}}"></path><path d="{{r.art.d1}}" fill="{{r.art.f1}}"></path><path d="{{r.art.d2}}" fill="{{r.art.f2}}"></path><path d="{{r.art.d3}}" fill="{{r.art.f3}}"></path><path d="{{r.art.d4}}" fill="{{r.art.f4}}"></path><path d="{{r.art.d5}}" fill="{{r.art.f5}}"></path></svg></sc-if><sc-if value="{{r.noArt}}" hint-placeholder-val="{{ false }}"><svg class="fb" viewBox="0 0 24 24" aria-hidden="true"><path d="{{r.secD}}"></path></svg></sc-if></span><b class="bidi">{{r.name}}</b><sc-if value="{{r.note}}" hint-placeholder-val="{{ false }}"><span class="nt3">{{r.note}}</span></sc-if></button>
                </sc-for>
              </div></sc-if>
              <sc-if value="{{rowsL}}" hint-placeholder-val="{{ true }}">
              <sc-for list="{{sc.rows}}" as="r" hint-placeholder-count="3">
                <button class="{{r.cls}}" aria-label="{{r.aria}}">
                  <span class="{{r.tileCls}}"><sc-if value="{{r.art.has}}" hint-placeholder-val="{{ true }}"><svg class="art" viewBox="0 0 48 48" aria-hidden="true"><path d="{{r.art.d0}}" fill="{{r.art.f0}}"></path><path d="{{r.art.d1}}" fill="{{r.art.f1}}"></path><path d="{{r.art.d2}}" fill="{{r.art.f2}}"></path><path d="{{r.art.d3}}" fill="{{r.art.f3}}"></path><path d="{{r.art.d4}}" fill="{{r.art.f4}}"></path><path d="{{r.art.d5}}" fill="{{r.art.f5}}"></path></svg></sc-if><sc-if value="{{r.noArt}}" hint-placeholder-val="{{ false }}"><svg class="fb" viewBox="0 0 24 24" aria-hidden="true"><path d="{{r.secD}}"></path></svg></sc-if></span>
                  <span class="tx">
                    <b class="bidi">{{r.name}}</b>
                    <sc-if value="{{r.hasLine}}" hint-placeholder-val="{{ false }}">
                      <span class="nt2">
                        <sc-if value="{{r.queued}}" hint-placeholder-val="{{ false }}"><span class="qd"><svg class="s xs" viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 7v5l3 2"></path></svg>{{t.waiting}}</span></sc-if>
                        <sc-if value="{{r.pin}}" hint-placeholder-val="{{ false }}"><span class="pinb bidi"><svg class="s" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path></svg>{{r.pin}}</span></sc-if>
                        <sc-if value="{{r.note}}" hint-placeholder-val="{{ false }}"><span>{{r.note}}</span></sc-if>
                      </span>
                    </sc-if>
                  </span>
                  <span class="{{r.whoCls}}" title="{{r.whoName}}"></span>
                  <span class="qty">{{r.q}}</span>
                </button>
              </sc-for>
              </sc-if>
            </div></div>
          </div>
        </sc-for>
      </sc-if>
    </sc-if>

    <sc-if value="{{onRec}}" hint-placeholder-val="{{ false }}">
      <div class="ft rise" style="margin-top:28px;align-items:center;text-align:center">
        <span class="ic" style="width:64px;height:64px;border-radius:20px"><svg class="s lg" viewBox="0 0 24 24" style="width:28px;height:28px"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"></path></svg></span>
        <b style="font-size:19px;font-weight:800;letter-spacing:-.02em">{{t.recT}}</b>
        <span class="sub" style="max-width:270px">{{t.recS}}</span>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;margin-top:8px">
          <button class="btn" style="height:48px">{{t.recPhoto}}</button>
          <button class="btn" style="height:48px">{{t.recLink}}</button>
          <button class="btn" style="height:48px">{{t.recType}}</button>
        </div>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{showStart}}" hint-placeholder-val="{{ true }}">
    <div class="startwrap">
      <a class="sm-start" href="StoreMode-phone.dc.html">
        <svg class="s lg" viewBox="0 0 24 24"><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L21 7H6"></path></svg>
        <span>{{t.start}}</span><span class="c">{{startCount}}</span>
      </a>
    </div>
  </sc-if>

  <sc-if value="{{menu}}" hint-placeholder-val="{{ false }}">
    <button style="position:absolute;inset:0;z-index:4;border:0;background:transparent" onClick="{{toggleMenu}}" aria-label="{{t.close}}"></button>
    <div class="menu grow" style="position:absolute;top:82px;inset-inline-end:14px;width:232px;z-index:5;transform-origin:{{menuOrigin}}" role="menu">
      <sc-for list="{{menuItems}}" as="m" hint-placeholder-count="5">
        <button class="mi" role="menuitem" style="width:100%;border:0;background:transparent;height:44px;color:var(--ink)"><svg class="s" viewBox="0 0 24 24" style="color:var(--muted)"><path d="{{m.d}}"></path></svg>{{m.label}}</button>
      </sc-for>
    </div>
  </sc-if>

  <nav class="dock5" aria-label="{{t.nav}}">
    <button class="tab-b"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg><span>{{t.home}}</span></button>
    <button class="tab-b"><svg viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z M7.5 7.5h.01"></path></svg><span>{{t.products}}</span></button>
    <a class="plus" href="Add-phone.dc.html" aria-label="{{t.addPh}}"><svg viewBox="0 0 24 24"><path d="M12 5v14 M5 12h14"></path></svg></a>
    <button class="tab-b on" aria-current="page"><svg viewBox="0 0 24 24"><path d="M5 10l2 10a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l2-10 M3 10h18 M8 10l3-6 M16 10l-3-6"></path></svg><span>{{t.title}}</span></button>
    <button class="tab-b"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"></path></svg><span>{{t.insights}}</span></button>
  </nav>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"language":{"editor":"enum","options":["עברית","English"],"default":"עברית"},"section colours":{"editor":"boolean","default":true},"state":{"editor":"enum","options":["normal","first time","draft for tomorrow","viewer","offline"],"default":"normal"},"data":{"editor":"enum","options":["demo","worst case"],"default":"demo"},"layout":{"editor":"enum","options":["rows","tiles"],"default":"rows"},"dark":{"editor":"boolean","default":false},"palette":{"editor":"enum","options":["graphite","plum"],"default":"graphite"},"motion":{"editor":"enum","options":["full","reduced"],"default":"full"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const p = this.props, s = this.state || {};
    const he = (p.language ?? 'עברית') === 'עברית';
    const L = (e, h) => he ? h : e;
    const st = p.state ?? 'normal';
    const worst = (p.data ?? 'demo') === 'worst case';
    const viewer = st === 'viewer', offline = st === 'offline', draft = st === 'draft for tomorrow';
    const first = st === 'first time' && !s.started;
    const tiles = (p.layout ?? 'rows') === 'tiles';
    const tab = s.tab || 'list';
    const onList = tab === 'list', onRec = tab === 'rec';
    const t = {
      title: L('Supermarket','סופר'), list: L('List','רשימה'), recipes: L('Recipes','מתכונים'), more: L('More','עוד'), close: L('Close','סגירה'),
      offline: L('Offline · 2 waiting','לא מקוון · 2 ממתינים'), viewOnly: L('View only','צפייה בלבד'),
      changeStore: L('Change store','החלפת חנות'), addPh: L('Add an item','הוספת פריט'),
      scan: L('Scan a barcode','סריקת ברקוד'), photo: L('Photo of a package','צילום אריזה'), voice: L('Say it','הוספה בקול'), recipe: L('From a recipe','ממתכון'),
      ftTitle: L('Start your list','מתחילים רשימה'), basket: L('Basic weekly basket','סל שבועי בסיסי'), basketS: L('24 common items. Edit after.','24 פריטים נפוצים, עורכים אחר כך.'),
      build: L('Build my list','בנה לי רשימה'), buildS: L('From your answers, as suggestions','מהתשובות שלך, כהצעות'),
      paste: L('Paste a list','הדבקת רשימה'), pasteS: L('From WhatsApp or notes','מוואטסאפ או מהפתקים'),
      sugFoot: L('Your own items never change.','הפריטים שלכם לא משתנים.'), addAll: L('Add all','הוספת הכול'),
      waiting: L('Waiting','ממתין'), start: L('Start shopping','מתחילים קנייה'),
      recT: L('Your recipes','המתכונים שלכם'), recS: L('Save a recipe once, then add only what’s missing to the list.','שומרים מתכון פעם אחת, ומוסיפים לרשימה רק את מה שחסר.'),
      recPhoto: L('Photo','צילום'), recLink: L('Link','קישור'), recType: L('Type it','הקלדה'),
      home: L('Home','בית'), products: L('Products','מוצרים'), insights: L('Insights','תובנות'), nav: L('Main','ראשי')
    };
    const P = {
      produce:'M12 7c-3-2-7 0-7 5s3 9 7 9 7-4 7-9-4-7-7-5z M12 7c0-2 1-4 3-4',
      meat:'M3 12c3-5 9-6 13-2l5-3v10l-5-3c-4 4-10 3-13-2z M8 11h.01',
      deli:'M3 11h18a9 9 0 0 1-18 0z M7 7c1-2 3-2 4 0 M12 6c1-2 3-2 4 0',
      dry:'M7 3h10 M8 3v3l-3 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10l-3-4V3 M5 13h14',
      cans:'M6 5c0-1 2.7-2 6-2s6 1 6 2v14c0 1-2.7 2-6 2s-6-1-6-2z M6 5c0 1 2.7 2 6 2s6-1 6-2 M6 10h12',
      spice:'M9 3h6l1 4H8z M8 7h8v13a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1z M11 11h.01 M13 13h.01 M11 15h.01',
      bfast:'M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z M17 10h1.5a2.5 2.5 0 0 1 0 5H17 M8 3v3 M12 3v3',
      snack:'M12 3a9 9 0 1 0 9 9 3 3 0 0 1-3-3 3 3 0 0 1-3-3 3 3 0 0 1-3-3z M8.5 11.5h.01 M12 16h.01 M15.5 14h.01',
      drink:'M10 2h4 M10 2v4l-2 3v12a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V9l-2-3V2 M8 13h8',
      clean:'M9 9h6v12H9z M10 9V6h4 M14 6l4-2 M17 7h2',

    SUG.forEach(x => { if (acc[x.id]) base.push(I(x.id, x.k, x.en, x.hh, x.q, x.q, 'T', { isNew: true, thm: 'p6' })); });
    const items = base;
    const leave = (id, field) => { this.setState({ leaving: id }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ leaving: null, [field]: { ...((this.state || {})[field] || {}), [id]: true } }), 220); };
    const AK = { w1:'tom',w2:'cuc',w3:'ban',w4:'pep',w5:'chk',w6:'chk',w8:'hum',w9:'hum',w10:'pen',w11:'ric',w12:'ric',w13:'crt',w14:'tah',w15:'oil',w16:'tah',w18:'cor',w19:'cof',w23:'wat',w24:'jui',w25:'dis',w26:'trb',w27:'tp',w28:'tpa',w33:'brd',w34:'pit',w35:'mlk',w36:'cot',w37:'yog',w38:'egg',w39:'pea',s1:'egg',s2:'chl',s3:'prm',s4: worst ? '' : 'tp' };
    const keyOf = (id) => (id in AK) ? AK[id] : (ART[id] ? id : '');
    const sugs = SUG.filter(x => !acc[x.id] && !dis[x.id]).map(x => ({
      name: (he ? x.hh : x.en) + ' ' + x.q, why: x.why, icon: IC[x.ic], art: art(keyOf(x.id)), noArt: !ART[keyOf(x.id)], secD: P[x.k], tileCls: 'pt sm k-' + x.k,
      cls: 'sug-r' + (s.leaving === x.id ? ' leave' : ''),
      yes: () => leave(x.id, 'acc'), no: () => leave(x.id, 'dis'),
      yesLabel: L('Add ', 'הוספת ') + (he ? x.hh : x.en), noLabel: L('Not now: ', 'לא עכשיו: ') + (he ? x.hh : x.en)
    }));
    const secs = SEC.map(([k, en, hh]) => {
      const rows = items.filter(r => r.k === k).map(r => {
        const pin = r.pe ? (he ? r.ph : r.pe) : '';
        const note = r.ne ? (he ? r.nh : r.ne) : '';
        const queued = offline && !!r.qd;
        const who = W[r.w] || W.T;
        const ak = keyOf(r.id);
        return { art: art(ak), noArt: !ART[ak], secD: P[r.k], tileCls: 'pt k-' + r.k, tileClsL: 'pt lg k-' + r.k, tlCls: 'tl k-' + r.k + (r.isNew ? ' nrow' : ''),
          name: he ? r.hh : r.en, q: he ? r.qh : r.q, note, pin, queued, hasLine: !!(note || pin || queued),
          cls: 'srow' + (r.isNew ? ' nrow' : ''), thm: 'thm ' + (r.thm || 'p1'), whoCls: 'whod ' + who.c,
          whoName: L('Added by ', 'הוסיף/ה: ') + (he ? who.he : who.en), aria: (he ? r.hh : r.en) + ', ' + (he ? r.qh : r.q) };
      });
      const open = !shut[k];
      return { k, si: 'si k-' + k, kc: 'k-' + k, name: he ? hh : en, d: P[k], rows, count: rows.length, open, cls: 'sec k-' + k + (open ? '' : ' shut'),
        toggle: () => this.setState({ shut: { ...((this.state || {}).shut || {}), [k]: open } }) };
    }).filter(x => x.rows.length);
    const n = items.length;
    const sugOpen = !s.sugShut;
    const showSug = !first && !viewer && onList && sugs.length > 0;
    const shelvesK = ['produce','bread','dairy','cans','clean'];
    const H = ['74px','96px','84px','62px','104px'];
    const MI = [
      [L('Templates','תבניות'),'M4 4h16v6H4z M4 14h7v6H4z M15 14h5v6h-5z'],
      [L('Past trips','קניות קודמות'),'M12 21a9 9 0 1 0-9-9 M3 4v5h5 M12 7v5l3 2'],
      [L('Receipts','קבלות'),'M5 3v18l2-1.5L9 21l2-1.5L13 21l2-1.5L17 21l2-1.5V3l-2 1.5L15 3l-2 1.5L11 3 9 4.5 7 3z M9 9h6 M9 13h6'],
      [L('Section order','סדר מחלקות'),'M8 6h13 M8 12h13 M8 18h13 M3 6h.01 M3 12h.01 M3 18h.01'],
      [L('Show pictures','הצגת תמונות'),'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z']
    ];
    return {
      cls: 'nx' + (p.dark ? ' dark' : '') + ((p.palette ?? 'graphite') === 'plum' ? ' plum' : '') + ((p.motion ?? 'full') === 'reduced' ? ' rm' : '') + (p['section colours'] === false ? ' mono' : ''),
      dir: he ? 'rtl' : 'ltr', lang: he ? 'he' : 'en', t,
      space: worst ? L('The Wiśniewska-Kowalczyk family & friends from Herzl Street','משפחת וישנייבסקה-קובלצ׳יק והחברים מרחוב הרצל') : 'Jacoby Home',
      iniT: he ? 'ט' : 'T', iniN: he ? 'נ' : 'N', iniY: he ? 'י' : 'Y',
      offline, viewer, first, onList, onRec, tiles, rowsL: !tiles, boxCls: tiles ? 'box-t' : 'box-l',
      railLabel: L('Your list by section, in store order', 'הרשימה לפי מחלקות, בסדר החנות'),
      tabListCls: onList ? 'on' : '', tabRecCls: onRec ? 'on' : '',
      pillTf: 'translateX(' + (onRec ? (he ? '-100%' : '100%') : '0') + ')',
      toList: () => this.setState({ tab: 'list' }), toRec: () => this.setState({ tab: 'rec' }),
      chain: worst ? L('Shufersal Sheli','שופרסל שלי') : L('Shufersal Deal','שופרסל דיל'), chainIni: he ? 'ש' : 'S',
      branch: worst ? L('Azrieli Mall Modi’in, 2nd floor, next to the parking','קניון עזריאלי מודיעין, קומה 2, ליד החניון') : L('Herzl St.','רח׳ הרצל'),
      estimate: first ? '—' : (worst ? '≈ ₪1,975' : '≈ ₪376'),
      emCls: 'em' + (worst ? ' over' : ''), emW: first ? '0%' : (worst ? '100%' : '33%'),
      budgetLeft: worst ? L('₪340 over October','₪340 מעל אוקטובר') : L('₪1,140 left this month','נשארו ₪1,140 החודש'),
      canEdit: !viewer, shelves: shelvesK.map((k, i) => ({ p: P[k], h: H[i], d: (i * 60) + 'ms' })), start: () => this.setState({ started: true }),
      showSug, sugOpen, sugCls: 'sug' + (sugOpen ? '' : ' shut'), toggleSug: () => this.setState({ sugShut: sugOpen }),
      sugTitle: draft ? L('Ready for Thursday','מוכן ליום חמישי') : L('Nexus suggests','Nexus מציע'),
      sugSub: draft ? L(sugs.length + ' suggestions · your ' + (n - Object.keys(acc).length) + ' items stay as they are', sugs.length + ' הצעות · ' + (n - Object.keys(acc).length) + ' הפריטים שלכם נשארים כמו שהם') : L(sugs.length + ' things you usually buy', sugs.length + ' דברים שאתם קונים בדרך כלל'),
      sugs, acceptAll: () => { const a = { ...acc }; SUG.forEach(x => { if (!dis[x.id]) a[x.id] = true; }); this.setState({ acc: a }); },
      hasList: !first, secs, countLine: worst ? L(n + ' items · ' + secs.length + ' sections', n + ' פריטים · ' + secs.length + ' מחלקות') : L(n + ' items', n + ' פריטים'),
      showStart: onList && !first && !viewer, startCount: String(n),
      padBottom: (onList && !first && !viewer) ? '176px' : '110px',
      menu: !!s.menu, moreCls: 'ico-b' + (s.menu ? ' on' : ''), toggleMenu: () => this.setState({ menu: !s.menu }),
      menuOrigin: he ? 'top left' : 'top right', menuItems: MI.map(([label, d]) => ({ label, d }))
    };
  }
}
