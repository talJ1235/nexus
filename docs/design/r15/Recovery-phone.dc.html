<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lost access · email code</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nx.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="{{cls}}" style="width:390px;height:844px;display:flex;flex-direction:column;padding:12px 20px 24px;background:var(--screen)">
  <div style="height:44px;display:flex;align-items:center"><button class="btn icon ghost" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg></button></div>

  <sc-if value="{{isEmail}}" hint-placeholder-val="{{ true }}">
    <h1 class="t-title" style="margin-top:20px">Recover your account</h1>
    <p class="t-body" style="margin-top:8px">We'll email you a 6-digit code.</p>
    <div class="field" style="margin-top:28px">
      <label class="label" for="em">Email</label>
      <div class="input focus"><input id="em" type="email" value="tal.jacoby10@gmail.com"></div>
    </div>
    <div style="margin-top:auto"><a class="btn lg pri block" href="#">Send code</a></div>
  </sc-if>

  <sc-if value="{{isCode}}" hint-placeholder-val="{{ false }}">
    <h1 class="t-title" style="margin-top:20px">Check your email</h1>
    <p class="t-body" style="margin-top:8px">Enter the code sent to <b style="color:var(--ink)">tal.j•••@gmail.com</b></p>
    <div class="otp" style="margin-top:28px"><span>4</span><span>8</span><span>1</span><span class="on"></span><span></span><span></span></div>
    <sc-if value="{{isError}}" hint-placeholder-val="{{ false }}"><div class="hint err" style="margin-top:10px">Incorrect code. Try again.</div></sc-if>
    <div class="sub" style="margin-top:16px">Didn't get it? <span class="tiny num">Resend in 0:42</span></div>
    <div style="margin-top:auto"><a class="btn lg pri block" href="#">Verify</a></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"palette":{"editor":"enum","options":["graphite","plum"],"default":"graphite"},"state":{"editor":"enum","options":["email","code","wrong-code"],"default":"code"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const st = p.state ?? 'code';
    return { cls: 'nx' + (p.dark ? ' dark' : '') + ((p.palette ?? 'graphite') === 'plum' ? ' plum' : ''), isEmail: st === 'email', isCode: st !== 'email', isError: st === 'wrong-code' };
  }
}
</script>
</body>
</html>
