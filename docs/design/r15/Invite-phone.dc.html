<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invite people · phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nx.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
.li{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px}
.li+.li{border-top:1px solid var(--line-in)}
.qrbox{padding:12px;background:#fff;border-radius:12px;border:1px solid var(--line)}
</style>
</helmet>
<div class="{{cls}}" style="width:390px;height:844px;display:flex;flex-direction:column;background:var(--screen)">
  <div style="height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;background:var(--screen);border-bottom:1px solid var(--line-in)">
    <a class="btn icon ghost" href="#" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg></a><b style="font-size:16px">Invite people</b><span style="width:40px"></span>
  </div>
  <div style="padding:20px 16px;display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;justify-content:center"><div class="qrbox" style="width:200px"><div class="qr"><sc-for list="{{cells}}" as="c" hint-placeholder-count="625"><i class="{{c}}"></i></sc-for></div></div></div>
    <div class="card">
      <div class="li"><span style="flex:1">Join as</span><span class="sub">Member</span><svg class="i sm" viewBox="0 0 24 24" style="color:var(--faint)"><path d="m9 18 6-6-6-6"></path></svg></div>
      <div class="li"><span style="flex:1">Link expires</span><span class="sub">In 7 days</span><svg class="i sm" viewBox="0 0 24 24" style="color:var(--faint)"><path d="m9 18 6-6-6-6"></path></svg></div>
    </div>
    <div class="card">
      <a class="li" href="#"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg><span style="flex:1">Copy link</span></a>
      <a class="li" href="#"><svg class="i" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z"></path></svg><span style="flex:1">Send on WhatsApp</span></a>
      <a class="li" href="#"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg><span style="flex:1">Invite by email</span></a>
      <a class="li" href="#" style="color:var(--danger)"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="m5.6 5.6 12.8 12.8"></path></svg><span style="flex:1">Reset link</span></a>
    </div>
  </div>
  <div style="margin-top:auto;padding:0 16px 24px"><a class="btn lg pri block" href="#"><svg class="i" viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"></path></svg>Share invite link</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"palette":{"editor":"enum","options":["graphite","plum"],"default":"graphite"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const n = 25, cells = [];
    const f = (x, y, ox, oy) => { const dx = x - ox, dy = y - oy; if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return null; return dx === 0 || dy === 0 || dx === 6 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4); };
    let s = 23;
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      let v = f(x, y, 0, 0); if (v === null) v = f(x, y, 18, 0); if (v === null) v = f(x, y, 0, 18);
      const quiet = (x === 7 && y < 8) || (y === 7 && x < 8) || (x === 17 && y < 8) || (y === 7 && x > 16) || (y === 17 && x < 8) || (x === 7 && y > 16);
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      cells.push(v === null ? (!quiet && s % 9 < 4 ? 'b' : '') : (v ? 'b' : ''));
    }
    return { cls: 'nx' + (p.dark ? ' dark' : '') + ((p.palette ?? 'graphite') === 'plum' ? ' plum' : ''), cells };
  }
}
</script>
</body>
</html>
