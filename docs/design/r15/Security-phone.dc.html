<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Security · phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nx.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
.gh{font-size:13px;font-weight:600;color:var(--muted);padding:18px 4px 8px}
.li{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px}
.li+.li{border-top:1px solid var(--line-in)}
</style>
</helmet>
<div class="{{cls}}" style="width:390px;height:844px;display:flex;flex-direction:column;background:var(--screen)">
  <div style="height:56px;display:flex;align-items:center;gap:4px;padding:0 4px;background:var(--screen);border-bottom:1px solid var(--line-in)">
    <a class="btn icon ghost" href="#" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg></a><b style="font-size:16px">Security</b>
  </div>
  <div style="padding:6px 16px 24px;display:flex;flex-direction:column">
    <div class="card" style="margin-top:14px;padding:14px;border-color:color-mix(in srgb,var(--warn) 35%,var(--line))">
      <div style="display:flex;gap:12px;align-items:flex-start"><span class="ic warn"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"></rect><path d="M11 18h2"></path></svg></span><span style="flex:1;line-height:1.35"><b>New sign-in on iPad</b><br><span class="tiny">Haifa, Israel · Sep 23, 10:31</span></span></div>
      <div style="display:flex;gap:8px;margin-top:12px"><a class="btn sm" href="#" style="flex:1">Yes, it was me</a><a class="btn sm pri" href="#" style="flex:1">No, sign it out</a></div>
    </div>
    <div class="gh">Passkeys</div>
    <div class="card">
      <div class="li"><span class="ic"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M11 18h2"></path></svg></span><span style="flex:1;line-height:1.3"><b>Pixel 8</b><br><span class="tiny">Last used today</span></span><svg class="i sm" viewBox="0 0 24 24" style="color:var(--faint)"><path d="m9 18 6-6-6-6"></path></svg></div>
      <div class="li"><span class="ic"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg></span><span style="flex:1;line-height:1.3"><b>Windows Hello</b><br><span class="tiny">Last used yesterday</span></span><svg class="i sm" viewBox="0 0 24 24" style="color:var(--faint)"><path d="m9 18 6-6-6-6"></path></svg></div>
      <a class="li" href="#" style="color:var(--ink);font-weight:600"><span class="ic" style="background:transparent"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></span>Add passkey</a>
    </div>
    <div class="gh">Devices</div>
    <div class="card">
      <div class="li"><span class="ic"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M11 18h2"></path></svg></span><span style="flex:1;line-height:1.3"><b>This phone</b><br><span class="tiny">Active now</span></span></div>
      <div class="li"><span class="ic"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg></span><span style="flex:1;line-height:1.3"><b>Chrome on Windows</b><br><span class="tiny">Tel Aviv · 1 hour ago</span></span><a class="btn sm ghost" href="#">Sign out</a></div>
    </div>
    <a class="btn block" href="#" style="margin-top:16px">Sign out of all other devices</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"palette":{"editor":"enum","options":["graphite","plum"],"default":"graphite"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { cls: 'nx' + (p.dark ? ' dark' : '') + ((p.palette ?? 'graphite') === 'plum' ? ' plum' : '') };
  }
}
</script>
</body>
</html>
