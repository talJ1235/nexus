<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create a space · desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nx.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
.sw{width:28px;height:28px;border-radius:50%}
.sw.on{box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 10px;border-radius:7px;background:var(--s2);font-size:13px;font-weight:500}
</style>
</helmet>
<div class="{{cls}}" style="width:1440px;height:900px;position:relative;overflow:hidden">
  <div style="position:absolute;inset:10px 10px 10px 258px;background:var(--screen);border:1px solid var(--line);border-radius:12px"></div>
  <div class="scrim"></div>
  <div class="modal" role="dialog" aria-label="Create a space" style="left:460px;top:220px;width:520px">
    <sc-if value="{{isIdentity}}" hint-placeholder-val="{{ true }}">
      <div class="mhead"><h2 class="t-h2" style="flex:1">Create a space</h2><a class="btn sm icon ghost" href="#" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg></a></div>
      <div class="mbody" style="display:flex;flex-direction:column;gap:18px">
        <div style="display:flex;gap:16px;align-items:center">
          <span class="ws xl w-green">C</span>
          <div style="display:flex;gap:10px"><span class="sw on w-green"></span><span class="sw w-blue"></span><span class="sw w-violet"></span><span class="sw w-amber"></span><span class="sw w-rose"></span><span class="sw w-slate"></span></div>
        </div>
        <div class="field"><label class="label" for="n">Space name</label><div class="input focus"><input id="n" value="Cohen home"></div></div>
        <div class="field"><label class="label" for="cur">Currency</label><div class="input"><select id="cur"><option>₪ Israeli shekel (ILS)</option></select></div></div>
      </div>
      <div class="mfoot"><a class="btn" href="#">Cancel</a><a class="btn pri" href="#">Continue</a></div>
    </sc-if>
    <sc-if value="{{isInvite}}" hint-placeholder-val="{{ false }}">
      <div class="mhead"><span class="ws w-green">C</span><h2 class="t-h2" style="flex:1">Invite people to Cohen home</h2></div>
      <div class="mbody" style="display:flex;flex-direction:column;gap:18px">
        <div class="field"><label class="label">Email addresses</label>
          <div class="input focus" style="height:auto;min-height:44px;padding:7px 8px;flex-wrap:wrap"><span class="chip">noa.cohen@gmail.com<svg class="i sm" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg></span><span class="chip">yoav.c@gmail.com<svg class="i sm" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg></span><input style="min-width:120px;height:28px"></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px"><span class="label" style="flex:1">Invite as</span><span class="sel">Member<svg class="i sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg></span></div>
        <div class="divider"></div>
        <div style="display:flex;align-items:center;gap:12px"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg></span><span style="flex:1;line-height:1.3"><b>Invite link</b><br><span class="sub">Anyone with the link can join</span></span><a class="btn sm" href="#">Copy link</a></div>
      </div>
      <div class="mfoot"><a class="btn ghost" href="#" style="margin-inline-end:auto">Skip for now</a><a class="btn pri" href="#">Send invites</a></div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"palette":{"editor":"enum","options":["graphite","plum"],"default":"graphite"},"step":{"editor":"enum","options":["details","invite"],"default":"details"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const st = p.step ?? 'details';
    return { cls: 'nx' + (p.dark ? ' dark' : '') + ((p.palette ?? 'graphite') === 'plum' ? ' plum' : ''), isIdentity: st === 'details', isInvite: st === 'invite', top: '220px' };
  }
}
</script>
</body>
</html>
