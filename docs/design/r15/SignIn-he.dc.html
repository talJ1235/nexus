<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>כניסה · טלפון</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nx.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
.acct{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--raised);box-shadow:var(--sh1)}
</style>
</helmet>
<div class="{{cls}}" dir="rtl" style="width:390px;height:844px;display:flex;flex-direction:column;background:var(--screen)">
  <section class="art" style="height:430px;flex-shrink:0;border-radius:0 0 24px 24px" dir="ltr">
    <div class="stage">
      <sc-for list="{{cubes}}" as="c" hint-placeholder-count="300">
        <div class="cube" style="left:{{c.x}}px;top:{{c.y}}px;width:{{c.w}}px;height:{{c.h}}px;animation-delay:{{c.dl}}s"><i style="clip-path:{{c.cl}};background:{{c.fl}}"></i><i style="clip-path:{{c.cr}};background:{{c.fr}}"></i><i style="clip-path:{{c.ct}};background:{{c.ft}}"></i><i class="gl" style="clip-path:{{c.ct}};animation-delay:{{c.dl}}s"></i></div>
      </sc-for>
    </div>
    <div class="mark" style="left:0;right:0;bottom:24px;justify-content:center;font-size:26px"><svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true"><path d="M32 8 54 20 32 32 10 20z" fill="#fb7a3c"></path><path d="M10 20l22 12v24L10 44z" fill="var(--face)" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round"></path><path d="M54 20 32 32v24l22-12z" fill="#f59e0b"></path></svg>Nexus</div>
  </section>
  <section style="flex:1;padding:24px 20px 20px;display:flex;flex-direction:column;gap:10px">
    <a class="acct" href="#"><span class="av lg c1">ט</span><span style="flex:1;line-height:1.3"><b>המשך בתור טל</b><br><span class="sub" dir="ltr">tal.jacoby10@gmail.com</span></span><span class="badge last">שימוש אחרון</span></a>
    <div class="or" style="margin:4px 0">או</div>
    <a class="btn lg block" href="#"><span class="g">G</span>המשך עם Google</a>
    <a class="btn lg block" href="#"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"></circle><path d="M3 21v-1a6 6 0 0 1 9-5.2"></path><circle cx="18" cy="15" r="2.5"></circle><path d="M18 17.5V22l1.5-1.2M18 20h1.5"></path></svg>המשך עם מפתח גישה</a>
    <div style="margin-top:auto;text-align:center" class="tiny">בהמשך אתה מסכים ל<a class="link" style="font-weight:500" href="#">תנאי השימוש</a> ול<a class="link" style="font-weight:500" href="#">מדיניות הפרטיות</a>.</div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"palette":{"editor":"enum","options":["graphite","plum"],"default":"graphite"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  field(W, H, N, s, cx, cy, dark, plum) {
    const a = s * 0.866, b = s * 0.5, EX = 26, out = [];
    const ox = W * cx, oy = H * cy - (N - 1) * b;
    const c = (N - 1) / 2;
    const L = plum
      ? (dark
        ? [['#1f1830', '#150f22', '#1a1329'], ['#2a2045', '#1b1430', '#231a3b'], ['#3d2d6b', '#261c45', '#33265c'], ['#6a4fd6', '#3a2b6e', '#5638c4'], ['#a78bfa', '#2e2350', '#7c4dff']]
        : [['#fbf9ff', '#ebe4f8', '#e0d6f3'], ['#efe7ff', '#e2d6fa', '#d3c2f5'], ['#ddcbff', '#d0bdf7', '#bca2f0'], ['#bfa3fb', '#c7b3f6', '#9a78f0'], ['#a78bfa', '#ece6f8', '#7c4dff']])
      : (dark
        ? [['#221a15', '#15100c', '#1b1410'], ['#2e2219', '#1a130e', '#251b13'], ['#4a3020', '#24170f', '#3a2618'], ['#a2522a', '#3a2416', '#86461f'], ['#fb7a3c', '#2a2420', '#f59e0b']]
        : [['#fffaf5', '#f5e2d3', '#eccfba'], ['#ffe9d6', '#f6d4ba', '#efbf9b'], ['#ffd0a9', '#f6c29a', '#eea672'], ['#fdaa6e', '#f8b583', '#ef8a45'], ['#fb7a3c', '#fde3cf', '#f59e0b']]);
    const q = (v) => Math.round(v * 10) / 10;
    for (let k = 0; k <= 2 * (N - 1); k++) for (let i = 0; i < N; i++) {
      const j = k - i; if (j < 0 || j >= N) continue;
      const d = Math.hypot(i - c, j - c);
      if (d > N * 0.62) continue;
      const f = ((Math.cos(d * 0.62) + 1) / 2) * Math.exp(-d * 0.06);
      const h = 4 + f * s * 2.6;
      const x = ox + (i - j) * a, y = oy + (i + j) * b - h;
      const band = Math.min(4, Math.floor(f * 5.2));
      const C = L[band];
      const A2 = q(2 * a), B2 = q(2 * b), HH = q(2 * b + h + EX);
      out.push({
        x: q(x - a), y: q(y - b), w: A2, h: HH, dl: q(-d * 0.42),
        ct: 'polygon(' + q(a) + 'px 0,' + A2 + 'px ' + q(b) + 'px,' + q(a) + 'px ' + B2 + 'px,0 ' + q(b) + 'px)',
        cl: 'polygon(0 ' + q(b) + 'px,' + q(a) + 'px ' + B2 + 'px,' + q(a) + 'px ' + HH + 'px,0 ' + q(b + h + EX) + 'px)',
        cr: 'polygon(' + q(a) + 'px ' + B2 + 'px,' + A2 + 'px ' + q(b) + 'px,' + A2 + 'px ' + q(b + h + EX) + 'px,' + q(a) + 'px ' + HH + 'px)',
        ft: C[0], fl: C[1], fr: C[2]
      });
    }
    return out;
  }
  renderVals() {
    const p = this.props;
    const dark = !!p.dark, plum = (p.palette ?? 'graphite') === 'plum';
    return { cls: 'nx' + (dark ? ' dark' : '') + (plum ? ' plum' : ''), cubes: this.field(390, 430, 15, 20, 0.5, 0.42, dark, plum) };
  }
}
</script>
</body>
</html>
