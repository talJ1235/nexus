<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Passkey · create</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nx.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
.os{position:absolute;inset-inline:8px;bottom:8px;border-radius:28px;background:#f3f1f6;color:#1b1b1f;padding:24px 22px 18px;box-shadow:0 -6px 30px rgba(0,0,0,.25);font-family:system-ui,'Segoe UI',Roboto,sans-serif}
.nx.dark .os{background:#2b2930;color:#e6e1e9}
.os .b{height:40px;padding:0 20px;border-radius:999px;font-weight:600;font-size:14px;display:inline-flex;align-items:center}
</style>
</helmet>
<div class="{{cls}}" style="width:390px;height:844px;display:flex;flex-direction:column;padding:12px 20px 24px;background:var(--screen);position:relative;overflow:hidden">
  <div style="height:44px;display:flex;align-items:center"><button class="btn icon ghost" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg></button></div>

  <sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
    <div style="margin-top:64px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px">
      <span class="ic round" style="width:72px;height:72px;background:var(--s2)"><svg class="i xl" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"></circle><path d="M3 21v-1a6 6 0 0 1 9-5.2"></path><circle cx="18" cy="15" r="2.5"></circle><path d="M18 17.5V22l1.5-1.2M18 20h1.5"></path></svg></span>
      <h1 class="t-title" style="margin-top:6px">Create a passkey</h1>
      <p class="t-body" style="max-width:290px">Sign in with your fingerprint, face or screen lock.</p>
    </div>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
      <a class="btn lg pri block" href="#">Continue</a>
      <a class="btn lg ghost block" href="#">Not now</a>
    </div>
  </sc-if>

  <sc-if value="{{isWaiting}}" hint-placeholder-val="{{ false }}">
    <div class="scrim"></div>
    <div class="os" role="dialog" aria-label="Create passkey">
      <div style="display:flex;justify-content:center;margin-bottom:14px"><svg viewBox="0 0 24 24" width="30" height="30" style="fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><circle cx="9" cy="8" r="4"></circle><path d="M3 21v-1a6 6 0 0 1 9-5.2"></path><circle cx="18" cy="15" r="2.5"></circle><path d="M18 17.5V22l1.5-1.2M18 20h1.5"></path></svg></div>
      <div style="text-align:center;font-size:20px;font-weight:500">Create passkey for Nexus?</div>
      <div style="display:flex;align-items:center;gap:12px;margin:18px 0;padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.05)">
        <span class="av c1">T</span><span style="line-height:1.3;font-size:14px">Tal Jacoby<br><span style="opacity:.7;font-size:13px">tal.jacoby10@gmail.com</span></span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="b" style="color:#5b4fa5">More options</span><span style="display:flex;gap:6px"><span class="b" style="color:#5b4fa5">Cancel</span><span class="b" style="background:#5b4fa5;color:#fff">Continue</span></span></div>
    </div>
  </sc-if>

  <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
    <div style="margin-top:64px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px" class="fade">
      <span class="ic round ok" style="width:72px;height:72px"><svg class="i xl" viewBox="0 0 24 24" style="stroke-width:2.4"><path d="M20 6 9 17l-5-5"></path></svg></span>
      <h1 class="t-title" style="margin-top:6px">Passkey created</h1>
      <p class="t-body">Next time, sign in with one tap.</p>
    </div>
    <div class="card" style="margin-top:32px">
      <div class="row"><span class="ic"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M11 18h2"></path></svg></span><span class="grow"><b>Pixel 8</b><br><span class="tiny">Google Password Manager</span></span></div>
    </div>
    <div style="margin-top:auto"><a class="btn lg pri block" href="#">Done</a></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"palette":{"editor":"enum","options":["graphite","plum"],"default":"graphite"},"state":{"editor":"enum","options":["offer","system-prompt","done"],"default":"offer"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const st = p.state ?? 'offer';
    return { cls: 'nx' + (p.dark ? ' dark' : '') + ((p.palette ?? 'graphite') === 'plum' ? ' plum' : ''), notDone: st !== 'done', isWaiting: st === 'system-prompt', isDone: st === 'done' };
  }
}
</script>
</body>
</html>
