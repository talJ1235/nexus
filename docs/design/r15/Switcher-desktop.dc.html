<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Space switcher · desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nx.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
.sk{border-radius:6px;background:var(--s2)}
</style>
</helmet>
<div class="{{cls}}" style="width:1440px;height:900px;display:flex;padding:10px 10px 10px 0">
  <aside style="width:248px;flex-shrink:0;padding:6px 10px;display:flex;flex-direction:column;gap:2px;position:relative">
    <button style="display:flex;align-items:center;gap:10px;height:44px;padding:0 8px;border-radius:8px;border:0;background:var(--sel);font-weight:600;font-size:14px;margin-bottom:10px;text-align:start" aria-label="Switch space" aria-expanded="true">
      <span class="ws w-green">C</span><span style="flex:1">Cohen home</span>
      <svg class="i sm" viewBox="0 0 24 24" style="color:var(--muted)"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"></path></svg>
    </button>
    <a class="nav on" href="#"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a class="nav" href="#"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.4"></circle><circle cx="18" cy="20" r="1.4"></circle><path d="M2 3h3l2.7 12.4a1.5 1.5 0 0 0 1.5 1.1h8.6a1.5 1.5 0 0 0 1.5-1.1L21 7H6"></path></svg>To buy<span class="c">38</span></a>
    <a class="nav" href="#"><svg class="i" viewBox="0 0 24 24"><path d="M3 7h12v10H3zM15 10h4l2 3v4h-6"></path><circle cx="7" cy="18" r="1.6"></circle><circle cx="18" cy="18" r="1.6"></circle></svg>On the way<span class="c">5</span></a>
    <a class="nav" href="#"><svg class="i" viewBox="0 0 24 24"><path d="M3 3v18h18"></path><path d="m7 15 4-4 3 3 5-6"></path></svg>Spending</a>

    <div class="menu" role="menu" style="position:absolute;left:10px;top:54px;width:300px;z-index:3">
      <div class="mlabel">tal.jacoby10@gmail.com</div>
      <a class="mi" href="#" role="menuitem"><span class="ws sm w-slate">T</span>Tal<span class="r"><span class="kbd">⌃1</span></span></a>
      <a class="mi on" href="#" role="menuitem"><span class="ws sm w-green">C</span>Cohen home<span class="r"><svg class="i sm" viewBox="0 0 24 24" style="color:var(--ink)"><path d="M20 6 9 17l-5-5"></path></svg><span class="kbd">⌃2</span></span></a>
      <a class="mi" href="#" role="menuitem"><span class="ws sm w-amber">W</span>Workshop<span class="r"><span class="kbd">⌃3</span></span></a>
      <a class="mi" href="#" role="menuitem"><svg class="i sm" viewBox="0 0 24 24" style="margin:0 3px"><path d="M12 5v14M5 12h14"></path></svg>Create a space</a>
      <div class="divider" style="margin:6px 0"></div>
      <a class="mi" href="#" role="menuitem"><svg class="i sm" viewBox="0 0 24 24" style="margin:0 3px"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M19 8v6M22 11h-6"></path></svg>Invite people</a>
      <a class="mi" href="#" role="menuitem"><svg class="i sm" viewBox="0 0 24 24" style="margin:0 3px"><circle cx="12" cy="12" r="3"></circle><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>Settings</a>
      <div class="divider" style="margin:6px 0"></div>
      <a class="mi" href="#" role="menuitem"><svg class="i sm" viewBox="0 0 24 24" style="margin:0 3px"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>Log out</a>
    </div>

    <div style="margin-top:auto;padding:10px;display:flex;align-items:center;gap:10px">
      <span class="av sm c1">T</span><span style="font-size:13.5px;font-weight:500">Tal Jacoby</span>
    </div>
  </aside>
  <main style="flex:1;min-width:0;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:28px 32px;display:flex;flex-direction:column;gap:20px">
    <div style="display:flex;align-items:center;gap:12px"><h1 class="t-title" style="flex:1">Home</h1><div class="pile"><span class="av sm c1">T</span><span class="av sm c2">N</span><span class="av sm c3">Y</span></div><a class="btn sm" href="#">Share</a></div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px"><div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div></div>
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:12px;flex:1"><div class="sk"></div><div class="sk"></div></div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"palette":{"editor":"enum","options":["graphite","plum"],"default":"graphite"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { cls: 'nx' + (p.dark ? ' dark' : '') + ((p.palette ?? 'graphite') === 'plum' ? ' plum' : '') };
  }
}
</script>
</body>
</html>
