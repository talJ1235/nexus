<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invite people · desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nx.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 4px;border-radius:7px;background:var(--s2);font-size:13px;font-weight:500}
.qrbox{padding:10px;background:#fff;border-radius:10px;border:1px solid var(--line)}
</style>
</helmet>
<div class="{{cls}}" style="width:1440px;height:900px;position:relative;overflow:hidden">
  <div style="position:absolute;inset:10px 10px 10px 258px;background:var(--screen);border:1px solid var(--line);border-radius:12px"></div>
  <div class="scrim"></div>
  <div class="modal" role="dialog" aria-label="Invite to Cohen home" style="left:440px;top:150px;width:560px">
    <div class="mhead"><h2 class="t-h2" style="flex:1">Invite to Cohen home</h2><a class="btn sm icon ghost" href="#" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg></a></div>
    <div class="mbody" style="display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;gap:8px">
        <div class="input focus" style="flex:1;height:auto;min-height:40px;padding:5px 8px;flex-wrap:wrap"><span class="chip"><span class="av xs c6">D</span>dana.levi@gmail.com<svg class="i sm" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg></span><input placeholder="Add more…" style="min-width:110px;height:28px;font-size:14px"></div>
        <span class="sel" style="height:40px">Member<svg class="i sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg></span>
        <a class="btn pri" href="#">Invite</a>
      </div>
      <div class="card">
        <div class="row">
          <span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg></span>
          <span class="grow"><b>Invite link</b><br><span class="sub">Joins as Member · expires in 7 days</span></span>
          <span class="tgl on" role="switch" aria-checked="true"></span>
        </div>
        <div class="row" style="gap:8px">
          <div class="input" style="height:36px;flex:1;font-size:13px;color:var(--muted)">nexus-ashen-beta.vercel.app/join/Xr7Kq2…</div>
          <a class="btn sm" href="#" style="height:36px">Copy</a>
          <a class="btn sm icon" href="#" aria-label="Show QR code" style="height:36px;width:36px"><svg class="i sm" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3h-3zM18 18h3v3h-3z"></path></svg></a>
        </div>
      </div>
      <div>
        <div class="eyebrow" style="margin-bottom:6px">Pending</div>
        <div class="row" style="padding:8px 0;min-height:48px"><span class="av sm c5">M</span><span class="grow">maya.k@gmail.com</span><span class="tiny">Sent 2 days ago</span><a class="btn sm ghost" href="#">Resend</a><a class="btn sm ghost" href="#">Revoke</a></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"palette":{"editor":"enum","options":["graphite","plum"],"default":"graphite"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { cls: 'nx' + (p.dark ? ' dark' : '') + ((p.palette ?? 'graphite') === 'plum' ? ' plum' : '') };
  }
}
</script>
</body>
</html>
