<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Space switcher · phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nx.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
.sk{border-radius:10px;background:var(--s2)}
.li{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px}
.li.on{background:var(--sel)}
</style>
</helmet>
<div class="{{cls}}" style="width:390px;height:844px;position:relative;overflow:hidden;background:var(--screen)">
  <div style="height:56px;display:flex;align-items:center;gap:8px;padding:0 14px">
    <span class="ws sm w-green">C</span><b style="font-size:16px">Cohen home</b><svg class="i sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg>
    <span class="av sm c1" style="margin-inline-start:auto">T</span>
  </div>
  <div style="padding:8px 16px;display:flex;flex-direction:column;gap:12px"><div class="sk" style="height:120px"></div><div class="sk" style="height:220px"></div></div>
  <div class="scrim"></div>
  <div class="sheet" role="dialog" aria-label="Spaces" style="padding-bottom:20px">
    <div class="grab"></div>
    <div style="padding:6px 16px 10px;display:flex;align-items:center;justify-content:space-between"><b style="font-size:17px">Spaces</b><span class="tiny">tal.jacoby10@gmail.com</span></div>
    <a class="li" href="#"><span class="ws w-slate">T</span><span style="flex:1">Tal</span></a>
    <a class="li on" href="#"><span class="ws w-green">C</span><b style="flex:1">Cohen home</b><svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"></path></svg></a>
    <a class="li" href="#"><span class="ws w-amber">W</span><span style="flex:1">Workshop</span></a>
    <div class="divider" style="margin:6px 16px"></div>
    <a class="li" href="#"><svg class="i" viewBox="0 0 24 24" style="margin:0 5px"><path d="M12 5v14M5 12h14"></path></svg>Create a space</a>
    <a class="li" href="#"><svg class="i" viewBox="0 0 24 24" style="margin:0 5px"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M19 8v6M22 11h-6"></path></svg>Invite people</a>
    <a class="li" href="#"><svg class="i" viewBox="0 0 24 24" style="margin:0 5px"><circle cx="12" cy="12" r="3"></circle><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>Settings</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"palette":{"editor":"enum","options":["graphite","plum"],"default":"graphite"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { cls: 'nx' + (p.dark ? ' dark' : '') + ((p.palette ?? 'graphite') === 'plum' ? ' plum' : '') };
  }
}
</script>
</body>
</html>
