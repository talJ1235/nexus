<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join a space</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nx.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="{{cls}}" style="width:390px;height:844px;display:flex;flex-direction:column;padding:12px 20px 24px;background:var(--screen)">
  <div style="height:44px;display:flex;align-items:center"><span class="logo"><svg viewBox="0 0 64 64" width="22" height="22" aria-hidden="true"><path d="M32 8 54 20 32 32 10 20z" fill="#fb7a3c"></path><path d="M10 20l22 12v24L10 44z" fill="var(--face)" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round"></path><path d="M54 20 32 32v24l22-12z" fill="#f59e0b"></path></svg>Nexus</span></div>

  <sc-if value="{{isPreview}}" hint-placeholder-val="{{ true }}">
    <div style="margin-top:72px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px">
      <div style="position:relative"><span class="ws xl w-green" style="width:72px;height:72px;font-size:30px;border-radius:18px">C</span><span class="av c1" style="position:absolute;right:-8px;bottom:-6px;box-shadow:0 0 0 3px var(--raised)">T</span></div>
      <p class="t-body" style="margin-top:6px"><b style="color:var(--ink)">Tal Jacoby</b> invited you to join</p>
      <h1 class="t-title" style="margin-top:-8px">Cohen home</h1>
      <div style="display:flex;align-items:center;gap:8px" class="sub"><div class="pile"><span class="av xs c1">T</span><span class="av xs c2">N</span><span class="av xs c3">Y</span></div>3 members</div>
    </div>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
      <a class="btn lg pri block" href="#">Accept invite</a>
      <div class="tiny" style="text-align:center">You'll sign in with Google · invite expires in 6 days</div>
    </div>
  </sc-if>

  <sc-if value="{{isJoined}}" hint-placeholder-val="{{ false }}">
    <div style="margin-top:96px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px" class="fade">
      <span class="ic round ok" style="width:72px;height:72px"><svg class="i xl" viewBox="0 0 24 24" style="stroke-width:2.4"><path d="M20 6 9 17l-5-5"></path></svg></span>
      <h1 class="t-title" style="margin-top:6px">You joined Cohen home</h1>
    </div>
    <div style="margin-top:auto"><a class="btn lg pri block" href="#">Open Cohen home</a></div>
  </sc-if>

  <sc-if value="{{isExpired}}" hint-placeholder-val="{{ false }}">
    <div style="margin-top:96px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px">
      <span class="ic round" style="width:72px;height:72px"><svg class="i xl" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path><path d="M3 3l18 18"></path></svg></span>
      <h1 class="t-title" style="margin-top:6px">This invite has expired</h1>
      <p class="t-body">Ask Tal Jacoby for a new link.</p>
    </div>
    <div style="margin-top:auto"><a class="btn lg block" href="#">Go to Nexus</a></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"palette":{"editor":"enum","options":["graphite","plum"],"default":"graphite"},"state":{"editor":"enum","options":["preview","joined","expired"],"default":"preview"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const st = p.state ?? 'preview';
    return { cls: 'nx' + (p.dark ? ' dark' : '') + ((p.palette ?? 'graphite') === 'plum' ? ' plum' : ''), isPreview: st === 'preview', isJoined: st === 'joined', isExpired: st === 'expired' };
  }
}
</script>
</body>
</html>
