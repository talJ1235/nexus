<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Old guest link · notice</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nx.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="{{cls}}" style="width:390px;height:844px;display:flex;flex-direction:column;padding:12px 20px 24px;background:var(--screen)">
  <div style="height:44px;display:flex;align-items:center"><span class="logo"><svg viewBox="0 0 64 64" width="22" height="22" aria-hidden="true"><path d="M32 8 54 20 32 32 10 20z" fill="#fb7a3c"></path><path d="M10 20l22 12v24L10 44z" fill="var(--face)" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round"></path><path d="M54 20 32 32v24l22-12z" fill="#f59e0b"></path></svg>Nexus</span></div>
  <div style="margin-top:96px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px">
    <span class="ic round" style="width:72px;height:72px"><svg class="i xl" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path><path d="M3 3l18 18"></path></svg></span>
    <h1 class="t-title" style="margin-top:6px">This link no longer works</h1>
    <p class="t-body">Nexus now uses accounts. Ask Tal for a new invite.</p>
  </div>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
    <a class="btn lg pri block" href="#">Log in</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"palette":{"editor":"enum","options":["graphite","plum"],"default":"graphite"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { cls: 'nx' + (p.dark ? ' dark' : '') + ((p.palette ?? 'graphite') === 'plum' ? ' plum' : '') };
  }
}
</script>
</body>
</html>
