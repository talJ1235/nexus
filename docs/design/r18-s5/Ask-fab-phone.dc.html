<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Floating Ask · phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nx-s5.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="{{cls}}" dir="{{dir}}" lang="{{lang}}" style="width:390px;height:844px;font-family:'Heebo',system-ui,sans-serif">
  <div class="scr" style="padding-bottom:170px">
    <div class="top">
      <h1>{{t.hello}}</h1>
      <button class="ib" aria-label="{{t.inbox}}"><svg class="s lg" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9 M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg></button>
    </div>
    <div style="padding:0 16px 12px;font-size:13.5px;color:var(--muted)">{{t.sub}}</div>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 12px">
      <div class="w w-shop" style="position:relative;grid-column:span 2;height:164px">
        <div class="wh"><span class="ic"><svg viewBox="0 0 24 24"><path d="M5 10l2 10a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l2-10 M3 10h18 M8 10l3-6 M16 10l-3-6"></path></svg></span><span class="tt">{{t.next}}</span></div>
        <div style="display:flex;align-items:flex-end;gap:12px;margin-top:auto">
          <div style="flex:1"><div class="big">{{t.thu}}</div><div class="wsub"><b>24</b> {{t.items}} · <b>₪412</b></div></div>
          <button class="wbtn">{{t.start}}</button>
        </div>
      </div>
      <div class="w w-budget" style="position:relative;height:164px">
        <div class="wh"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 7h18v12H3z M3 11h18 M7 15h3"></path></svg></span><span class="tt">{{t.budget}}</span></div>
        <div style="margin-top:auto"><div class="big num">₪2,320</div><div class="track" style="margin-top:10px"><i style="width:66%"></i><b style="inset-inline-start:52%"></b></div><div class="wsub" style="margin-top:6px">{{t.of}}</div></div>
      </div>
      <div class="w w-ai" style="position:relative;height:164px">
        <div class="wh"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg></span><span class="tt">{{t.sug}}</span></div>
        <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
          <div class="bidi" style="font-size:15px;font-weight:700;line-height:1.3">{{t.eggs}}</div>
          <button class="wbtn soft" onClick="{{addEggs}}" style="align-self:flex-start"><svg class="s sm" viewBox="0 0 24 24"><path d="M12 5v14 M5 12h14"></path></svg>{{t.add}}</button>
        </div>
      </div>
      <div class="w w-way" style="position:relative;grid-column:span 2;height:120px">
        <div class="wh"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 7h11v9H3z M14 10h4l3 3v3h-7 M7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path></svg></span><span class="tt">{{t.way}}</span></div>
        <div style="margin-top:auto" class="wsub"><b>{{t.wayLine}}</b></div>
      </div>
    </div>
  </div>

  <div class="{{zoneLCls}}" style="left:6px" aria-hidden="true"></div>
  <div class="{{zoneRCls}}" style="left:308px" aria-hidden="true"></div>

  <sc-if value="{{bubble}}" hint-placeholder-val="{{ false }}">
    <button class="bubble" style="{{bubbleStyle}}" onClick="{{open}}"><span class="who">Nexus</span>{{t.bubble}}</button>
  </sc-if>

  <button class="{{askCls}}" style="left:{{askLeft}}px;transform:{{askTf}}" aria-label="{{t.ask}}" aria-describedby="askhint"
    onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}">
    <svg class="sp" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z" fill="var(--spark)"></path><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" fill="#fff"></path></svg>
    <sc-if value="{{dot}}" hint-placeholder-val="{{ false }}"><span class="dot"></span></sc-if>
  </button>
  <span id="askhint" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">{{t.dragHint}}</span>

  <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
    <div class="toast" role="status"><svg class="s" viewBox="0 0 24 24" style="color:var(--ok)"><path d="M5 12l5 5L20 7"></path></svg><span class="bidi" style="flex:1">{{t.toast}}</span><button class="u" onClick="{{undo}}">{{t.undo}}</button></div>
  </sc-if>

  <nav class="dock" aria-label="{{t.nav}}">
    <button class="tab on" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg><span>{{t.home}}</span></button>
    <button class="tab"><svg viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z M7.5 7.5h.01"></path></svg><span>{{t.products}}</span></button>
    <button class="plus" aria-label="{{t.addItem}}"><svg viewBox="0 0 24 24"><path d="M12 5v14 M5 12h14"></path></svg></button>
    <button class="tab"><svg viewBox="0 0 24 24"><path d="M5 10l2 10a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l2-10 M3 10h18 M8 10l3-6 M16 10l-3-6"></path></svg><span>{{t.sm}}</span></button>
    <button class="tab"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"></path></svg><span>{{t.insights}}</span></button>
  </nav>

  <sc-if value="{{chat}}" hint-placeholder-val="{{ false }}">
    <div class="chat" role="dialog" aria-label="{{t.ask}}" style="--ox:{{ox}}px;--oy:{{oy}}px">
      <div class="ch">
        <span class="ask" style="position:static;width:36px;height:36px;box-shadow:none;transform:none"><svg viewBox="0 0 24 24" style="width:18px;height:18px" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z" fill="var(--spark)"></path></svg></span>
        <h2>Nexus</h2>
        <button class="ib" aria-label="{{t.close}}" onClick="{{close}}"><svg class="s lg" viewBox="0 0 24 24"><path d="M6 6l12 12 M18 6 6 18"></path></svg></button>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:10px;padding:12px 16px;overflow:auto">
        <div class="msg me bidi">{{t.q}}</div>
        <div class="msg ai bidi">{{t.a}}
          <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><span class="chip">{{t.c1}}</span><span class="chip">{{t.c2}}</span><span class="chip">{{t.c3}}</span></div>
        </div>
        <button class="btn sm" style="align-self:flex-start">{{t.addAll}}</button>
      </div>
      <label class="compose"><input type="text" placeholder="{{t.ph}}" aria-label="{{t.ph}}" enterkeyhint="send"><button class="ib" aria-label="{{t.mic}}"><svg class="s" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z M19 11a7 7 0 0 1-14 0 M12 18v3"></path></svg></button></label>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"language":{"editor":"enum","options":["עברית","English"],"default":"עברית"},"side":{"editor":"enum","options":["right (default)","left (after a drag)"],"default":"right (default)"},"state":{"editor":"enum","options":["idle","message from Nexus","Nexus thinking","toast showing","chat open"],"default":"idle"},"dark":{"editor":"boolean","default":false},"palette":{"editor":"enum","options":["graphite","plum"],"default":"graphite"},"motion":{"editor":"enum","options":["full","reduced"],"default":"full"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const p = this.props, s = this.state || {};
    const he = (p.language ?? 'עברית') === 'עברית';
    const L = (e, h) => he ? h : e;
    const dark = !!p.dark, plum = (p.palette ?? 'graphite') === 'plum', rm = (p.motion ?? 'full') === 'reduced';
    const st = p.state ?? 'idle';
    const LEFT = 16, RIGHT = 318;
    const side = s.side ?? ((p.side ?? '').startsWith('left') ? 'left' : 'right');
    const toast = s.touched ? !!s.toast : st === 'toast showing';
    const msg = s.touched ? !!s.msg : st === 'message from Nexus';
    const chat = s.touched ? !!s.chat : st === 'chat open';
    const think = !s.touched && st === 'Nexus thinking';
    const rise = toast ? 68 : 0;
    const left = s.drag ? s.fx : (side === 'left' ? LEFT : RIGHT);
    const t = {
      hello: L('Good evening, Tal','ערב טוב, טל'), sub: L('Thursday · 3 things for you','יום חמישי · 3 דברים בשבילך'), inbox: L('Inbox','התראות'),
      next: L('Next shop','הקנייה הבאה'), thu: L('Today','היום'), items: L('items','פריטים'), start: L('Start','מתחילים'),
      budget: L('October budget','תקציב אוקטובר'), of: L('of ₪3,500 · on pace','מתוך ₪3,500 · בקצב'),
      sug: L('Nexus suggests','Nexus מציע'), eggs: L('Eggs — every ~9 days','ביצים — כל ~9 ימים'), add: L('Add','הוספה'),
      way: L('On the way','בדרך'), wayLine: L('Headphones arrive tomorrow','האוזניות מגיעות מחר'),
      ask: L('Ask Nexus','לשאול את Nexus'), dragHint: L('Drag to move it to the other side','אפשר לגרור לצד השני'),
      bubble: L('3 items are due for Thursday’s shop. Add them?','3 פריטים צריך לקנות לקנייה של חמישי. להוסיף?'),
      toast: L('Eggs added to the list','ביצים נוספו לרשימה'), undo: L('Undo','ביטול'),
      home: L('Home','בית'), products: L('Products','מוצרים'), addItem: L('Add','הוספה'), sm: L('Supermarket','סופר'), insights: L('Insights','תובנות'), nav: L('Main','ראשי'),
      close: L('Close','סגירה'), q: L('What’s missing for Shabbat?','מה חסר לשבת?'),
      a: L('Based on your usual Fridays: challah ×2, wine, and you’re out of olive oil.','לפי השישי הרגיל שלכם: חלה ×2, יין, ונגמר שמן זית.'),
      c1: L('Challah ×2','חלה ×2'), c2: L('Red wine','יין אדום'), c3: L('Olive oil','שמן זית'), addAll: L('Add all three','להוסיף את שלושתם'),
      ph: L('Ask anything','לשאול משהו'), mic: L('Say it','בקול')
    };
    const touch = (o) => this.setState(Object.assign({ touched: true, toast, msg, chat }, o));
    const dz = (on) => 'dropzone' + (s.drag && on ? ' show' : '');
    return {
      cls: 'nx ph' + (dark ? ' dark' : '') + (plum ? ' plum' : '') + (rm ? ' rm' : ''), dir: he ? 'rtl' : 'ltr', lang: he ? 'he' : 'en', t,
      askCls: 'ask' + (s.drag ? ' drag' : '') + (msg && !s.drag ? ' nudge msg' : '') + (think ? ' think' : ''), askLeft: left,
      askTf: 'translateY(' + (-rise) + 'px)' + (s.drag ? ' scale(1.08)' : ''), dot: msg,
      zoneLCls: dz(side !== 'left'), zoneRCls: dz(side !== 'right'),
      bubble: msg && !chat && !s.drag, bubbleStyle: (side === 'left' ? 'left:16px;' : 'right:16px;') + 'transform:translateY(' + (-rise) + 'px)',
      toast, chat, ox: left + 28, oy: 844 - 88 - 28 - rise,
      addEggs: () => { touch({ toast: true }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: false }), 4000); },
      undo: () => touch({ toast: false }),
      open: () => touch({ chat: true, msg: false }),
      close: () => touch({ chat: false }),
      down: (e) => { this._d = { x0: e.clientX, base: left, t: Date.now(), moved: false }; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} },
      move: (e) => {
        const d = this._d; if (!d) return; const dx = e.clientX - d.x0;
        if (!d.moved && Math.abs(dx) < 6) return; d.moved = true;
        this.setState({ drag: true, fx: Math.max(8, Math.min(326, d.base + dx)) });
      },
      up: (e) => {
        const d = this._d; this._d = null; if (!d) return;
        if (!d.moved) { touch({ chat: true, msg: false }); return; }
        const fx = (this.state || {}).fx ?? d.base; const v = (fx - d.base) / Math.max(Date.now() - d.t, 1);
        const nside = v < -0.5 ? 'left' : v > 0.5 ? 'right' : (fx + 28 < 195 ? 'left' : 'right');
        this.setState({ drag: false, fx: null, side: nside });
      }
    };
  }
}
</script>
</body>
</html>
