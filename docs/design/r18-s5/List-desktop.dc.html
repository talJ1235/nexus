<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>List v2 · computer</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nx-s5.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="{{cls}}" dir="{{dir}}" lang="{{lang}}" style="width:1366px;height:860px;font-family:'Heebo',system-ui,sans-serif;position:relative">
  <aside class="side" aria-label="{{t.nav}}">
    <div class="logo"><i></i>Nexus</div>
    <button class="nav"><svg class="s" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>{{t.home}}</button>
    <button class="nav"><svg class="s" viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z M7.5 7.5h.01"></path></svg>{{t.products}}</button>
    <button class="nav on" aria-current="page"><svg class="s" viewBox="0 0 24 24"><path d="M5 10l2 10a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l2-10 M3 10h18 M8 10l3-6 M16 10l-3-6"></path></svg>{{t.title}}</button>
    <button class="nav"><svg class="s" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"></path></svg>{{t.insights}}</button>
    <button class="nav"><svg class="s" viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3z"></path></svg>{{t.projects}}</button>
  </aside>

    </div>

    <div style="flex:1;min-height:0;display:flex;gap:20px;padding:4px 28px 24px">
      <section class="panel" style="flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden" aria-label="{{t.title}}">
        <div style="display:flex;align-items:center;gap:12px;padding:16px 18px 12px">
          <button class="store" style="width:auto;padding:0 10px 0 6px;height:46px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line)">
            <span class="chain" style="width:32px;height:32px;border-radius:10px;font-size:12px">{{chainIni}}</span>

            <svg class="s sm" viewBox="0 0 24 24" style="color:var(--faint)"><path d="m6 9 6 6 6-6"></path></svg>
          </button>
          <span style="flex:1"></span>
          <span class="num" style="font-size:13px;color:var(--muted)"><b style="color:var(--ink)">{{count}}</b> {{t.items}} · {{t.est}} <b style="color:var(--ink)">₪412</b></span>
        </div>
        <label class="addbar" style="margin:0 18px 12px;height:48px;box-shadow:inset 0 0 0 1px var(--line)">
          <svg class="s" viewBox="0 0 24 24" style="color:var(--faint)"><path d="M12 5v14 M5 12h14"></path></svg>

          <span class="chip" style="height:26px;color:var(--faint)">{{t.paste}}</span>
        </label>

                <div class="{{r.cls}}">
                  <button class="pt sm" aria-label="{{r.openLbl}}"><svg class="art" viewBox="0 0 48 48" aria-hidden="true"><path d="{{r.art.d0}}" fill="{{r.art.f0}}"></path><path d="{{r.art.d1}}" fill="{{r.art.f1}}"></path><path d="{{r.art.d2}}" fill="{{r.art.f2}}"></path><path d="{{r.art.d3}}" fill="{{r.art.f3}}"></path><path d="{{r.art.d4}}" fill="{{r.art.f4}}"></path><path d="{{r.art.d5}}" fill="{{r.art.f5}}"></path></svg></button>
                  <div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start">
                    <sc-if value="{{r.renaming}}" hint-placeholder-val="{{ false }}">
                      <input class="ren" style="max-width:420px;height:34px;font-size:15px" value="{{renVal}}" onChange="{{renChange}}" onBlur="{{renDone}}" onKeyDown="{{renKey}}" aria-label="{{t.rename}}" autofocus="autofocus">
                    </sc-if>
                    <sc-if value="{{r.notRenaming}}" hint-placeholder-val="{{ true }}">
                      <button class="bidi" onClick="{{r.ren}}" title="{{t.rename}}" style="border:0;background:transparent;padding:2px 4px;margin:-2px -4px;border-radius:6px;font-size:15px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:start">{{r.name}}</button>
                      <sc-if value="{{r.hasSub}}" hint-placeholder-val="{{ true }}"><span class="bidi" style="font-size:12.5px;color:var(--muted)">{{r.sub}}</span></sc-if>
                    </sc-if>
                  </div>
                  <div class="acts">
                    <button class="mini" aria-label="{{t.less}}" onClick="{{r.dec}}"><svg class="s sm" viewBox="0 0 24 24"><path d="M5 12h14"></path></svg></button>
                  </div>
                  <span class="qty" style="min-width:44px;justify-content:center"><span>{{r.cnt}}</span><sc-if value="{{r.hasW}}" hint-placeholder-val="{{ false }}"><i>· {{r.w}}</i></sc-if></span>

                </div>
              </sc-for>
            </div>
          </sc-for>
        </div>
      </section>

      <div style="width:372px;flex-shrink:0;display:flex;flex-direction:column;gap:14px;overflow:auto">

          <div class="meter" style="margin-top:6px;flex:none"><i style="width:62%"></i></div>
        </section>
        <section class="panel w-ai" style="padding:6px 0 10px">
          <div class="ph-h"><h2>{{t.sugs}}</h2><button class="btn sm ghost">{{t.addAll}}</button></div>
          <sc-for list="{{sugs}}" as="g" hint-placeholder-count="4">
            <div class="drow" style="height:52px">
              <span class="{{g.ptCls}}"><svg class="art" viewBox="0 0 48 48" aria-hidden="true"><path d="{{g.art.d0}}" fill="{{g.art.f0}}"></path><path d="{{g.art.d1}}" fill="{{g.art.f1}}"></path><path d="{{g.art.d2}}" fill="{{g.art.f2}}"></path><path d="{{g.art.d3}}" fill="{{g.art.f3}}"></path><path d="{{g.art.d4}}" fill="{{g.art.f4}}"></path><path d="{{g.art.d5}}" fill="{{g.art.f5}}"></path></svg></span>

              <button class="addc" aria-label="{{g.addLbl}}"><svg class="s sm" viewBox="0 0 24 24"><path d="M12 5v14 M5 12h14"></path></svg></button>
            </div>
          </sc-for>
        </section>
        <section class="panel" style="padding:6px 0 14px">
          <div class="ph-h"><h2>{{t.tpls}}</h2></div>
          <sc-for list="{{tpls}}" as="tp" hint-placeholder-count="2">

              <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px" class="bidi">{{tp.name}}</div><div style="font-size:12px;color:var(--muted)">{{tp.meta}}</div></div>
              <button class="btn sm">{{t.apply}}</button>
            </div>
          </sc-for>
        </section>
      </div>
    </div>

    <div class="toast" role="status" style="left:50%;right:auto;width:420px;margin-left:-210px;bottom:24px"><span class="bidi" style="flex:1">{{toastText}}</span><button class="u" onClick="{{undo}}">{{t.undo}}</button></div>
  </sc-if>
</div>
</x-dc>

      toPhone: L('Send to phone','שליחה לטלפון'), ask: L('Ask Nexus','לשאול את Nexus'), items: L('items','פריטים'), est: L('about','בערך'),
      addPh: L('Add items — type, or paste a whole list','הוספת פריטים — להקליד, או להדביק רשימה שלמה'), paste: L('Ctrl+V','Ctrl+V'),
      rename: L('Click to rename','לחיצה לשינוי שם'), less: L('Less','פחות'), more1: L('More','יותר'), del: L('Delete','מחיקה'),
      estT: L('This list','הרשימה הזאת'), vsUsual: L('₪38 under usual','₪38 פחות מהרגיל'), monthLeft: L('Left in October','נשאר באוקטובר'),
      sugs: L('Nexus suggests','Nexus מציע'), addAll: L('Add all','הוספת הכול'), tpls: L('Templates','תבניות'), apply: L('Add','הוספה'), undo: L('Undo','ביטול')
    };
    const SEC = { produce:['Fruit & vegetables','פירות וירקות'], meat:['Meat, poultry & fish','בשר, עוף ודגים'], dairy:['Dairy & eggs','חלב וביצים'],
      bread:['Bread & bakery','לחם ומאפים'], dry:['Dry goods','יבשים'], clean:['Cleaning & disposables','ניקיון וחד־פעמי'] };
    const WHO = { T:['#2f6fd1','Tal','טל'], N:['#c94673','Noa','נועה'], Y:['#1a9a8f','Yoav','יואב'] };
    const I = (id, k, en, hh, c, uw, w, br, nt) => ({ id, k, en, hh, c, uw, w, br, nt });
    const BASE = [
      I('tom','produce','Tomatoes','עגבניות',6,0.17,'T'), I('cuc','produce','Cucumbers','מלפפונים',4,0.15,'T'),
      I('ban','produce','Bananas','בננות',6,0.12,'N',null,['Not too ripe','לא בשלות מדי']), I('par','produce','Parsley','פטרוזיליה',2,0,'N'),
      I('chk','meat','Chicken breast','חזה עוף',1,0,'T',null,['Thin slices · 1 kg','פרוס דק · 1 ק״ג']),
      I('mlk','dairy','Milk 3%','חלב 3%',2,0,'N',['Tnuva','תנובה']), I('cot','dairy','Cottage cheese 5%','קוטג׳ 5%',3,0,'T',['Tara','טרה']),
      I('egg','dairy','Eggs, size L','ביצים L',12,0,'Y'), I('yog','dairy','Yogurt','יוגורט',4,0,'Y'),
      I('pit','bread','Pita','פיתות',10,0,'Y'),
      I('pen','dry','Penne 500 g','פסטה פנה 500 גרם',2,0,'N',['Barilla','ברילה']), I('ric','dry','Basmati rice 1 kg','אורז בסמטי 1 ק״ג',1,0,'T'),
      I('dis','clean','Dish soap','סבון כלים',1,0,'N'), I('tp','clean','Toilet paper, 32 rolls','נייר טואלט, 32 גלילים',1,0,'T')
    ];
    const names = s.names || {}, cnts = s.cnts || {}, gone = s.gone || {};
    const renId = s.touched ? s.ren : (st === 'renaming' ? 'cot' : null);
    const nameOf = (x) => names[x.id] ?? (he ? x.hh : x.en);
    const cntOf = (x) => cnts[x.id] ?? x.c;
    const wOf = (x) => { const kg = cntOf(x) * x.uw; return kg >= 1 ? L('~' + kg.toFixed(1).replace('.0','') + ' kg','~' + kg.toFixed(1).replace('.0','') + ' ק״ג') : L('~' + Math.round(kg * 20) * 50 + ' g','~' + Math.round(kg * 20) * 50 + ' גרם'); };
    const touch = (o) => this.setState(Object.assign({ touched: true, ren: renId }, o));
    const live = BASE.filter(x => !gone[x.id]);
    const secs = ['produce','meat','dairy','bread','dry','clean'].map(k => {
      const rows = live.filter(x => x.k === k).map(x => {
        const sub = [x.br ? (he ? x.br[1] : x.br[0]) : '', x.nt ? (he ? x.nt[1] : x.nt[0]) : ''].filter(Boolean).join(' · ');
        return {
          art: art(x.id), name: nameOf(x), sub, hasSub: !!sub, cnt: (x.uw ? '' : '×') + cntOf(x), hasW: !!x.uw, w: x.uw ? wOf(x) : '',
          cls: 'drow' + (!s.touched && st === 'row hovered' && x.id === 'cuc' ? ' hov' : ''), whoC: WHO[x.w][0], whoLbl: L('Added by ' + WHO[x.w][1], 'נוסף ע״י ' + WHO[x.w][2]),
          openLbl: L('Open ' + nameOf(x), 'פתיחת ' + nameOf(x)), renaming: renId === x.id, notRenaming: renId !== x.id,
          ren: () => touch({ ren: x.id, renv: nameOf(x) }),
          inc: () => touch({ cnts: Object.assign({}, cnts, { [x.id]: cntOf(x) + 1 }) }),
          dec: () => touch({ cnts: Object.assign({}, cnts, { [x.id]: Math.max(1, cntOf(x) - 1) }) }),
          del: () => { touch({ gone: Object.assign({}, gone, { [x.id]: true }), toast: x.id }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: null }), 5000); }
        };
      });
      return { cls: 'k-' + k, name: he ? SEC[k][1] : SEC[k][0], n: rows.length, rows };
    }).filter(x => x.n);
    const G = (id, k, en, hh, why) => ({ art: art(id), ptCls: 'pt sm k-' + k, name: he ? hh : en, why, addLbl: L('Add ' + en, 'הוספת ' + hh) });
    const sugs = [G('chl','bread','Challah ×2','חלה ×2',L('Shabbat','שבת')), G('prm','dairy','Grated parmesan','פרמזן מגורר',L('usually with pasta','בדרך כלל עם פסטה')),
      G('cof','bfast','Ground coffee','קפה טחון',L('every ~3 weeks','כל ~3 שבועות')), G('wat','drink','Sparkling water ×6','מים מוגזים ×6',L('every ~10 days','כל ~10 ימים'))];
    const T = (k, id) => ({ art: art(id), ptCls: 'pt xs k-' + k });
    const tpls = [
      { name: L('Weekly basics','בסיס שבועי'), meta: L('Made by Nexus · 18 items · ~₪340','נוצר ע״י Nexus · 18 פריטים · ~₪340'), tiles: [T('dairy','mlk'),T('produce','tom'),T('bread','pit')] },
      { name: L('Friday dinner','ארוחת שישי'), meta: L('Yours · 9 items · ~₪180','שלכם · 9 פריטים · ~₪180'), tiles: [T('bread','chl'),T('meat','chk'),T('produce','par')] }
    ];
    const tx = BASE.find(x => x.id === s.toast);
    const commit = () => { const v = ((this.state || {}).renv || '').trim(); if (!renId) return; this.setState({ touched: true, ren: null, names: Object.assign({}, names, v ? { [renId]: v } : {}) }); };
    return {
      cls: 'nx dk' + (dark ? ' dark' : '') + (plum ? ' plum' : '') + (rm ? ' rm' : ''), dir: he ? 'rtl' : 'ltr', lang: he ? 'he' : 'en', t,
      iniT: L('T','ט'), iniN: L('N','נ'), iniY: L('Y','י'), chainIni: L('SD','שד'), chain: L('Shufersal Deal','שופרסל דיל'), branch: L('Netanya, Poleg','נתניה, פולג'),
      askCls: 'ask' + (s.adrag ? ' drag' : ''), askLeft: s.adrag ? s.afx : ((s.aside ?? 'right') === 'left' ? (he ? 24 : 256) : (he ? 1050 : 1282)),
      askDown: (e) => { this._a = { x0: e.clientX, base: s.adrag ? s.afx : ((s.aside ?? 'right') === 'left' ? (he ? 24 : 256) : (he ? 1050 : 1282)), sc: (e.currentTarget.getBoundingClientRect().width / 60) || 1, moved: false }; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} },
      askMove: (e) => { const a = this._a; if (!a) return; const dx = (e.clientX - a.x0) / a.sc; if (!a.moved && Math.abs(dx) < 6) return; a.moved = true; this.setState({ adrag: true, afx: Math.max(he ? 16 : 244, Math.min(he ? 1058 : 1290, a.base + dx)) }); },
      askUp: () => { const a = this._a; this._a = null; if (!a || !a.moved) return; const fx = (this.state || {}).afx ?? a.base; this.setState({ adrag: false, aside: fx + 30 < (he ? 567 : 799) ? 'left' : 'right' }); },
      count: live.length, secs, sugs, tpls,
      toast: !!tx, toastText: tx ? L(nameOf(tx) + ' removed', nameOf(tx) + ' נמחק') : '',
      undo: () => { const g = Object.assign({}, gone); delete g[s.toast]; touch({ gone: g, toast: null }); },
      renVal: s.renv ?? (renId ? nameOf(BASE.find(x => x.id === renId)) : ''),
      renChange: (e) => this.setState({ renv: e.target.value }), renDone: commit,
      renKey: (e) => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') this.setState({ touched: true, ren: null, renv: null }); }
    };
  }
}
