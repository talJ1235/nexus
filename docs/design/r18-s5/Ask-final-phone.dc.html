<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Ask button — final (ink orb + AI ring) · phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nx-s5.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="{{cls}}" dir="{{dir}}" lang="{{lang}}" style="width:1330px;height:760px;font-family:'Heebo',system-ui,sans-serif;background:var(--bg);padding:32px 40px;box-sizing:border-box">
  <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:18px">
    <b style="font-size:22px;font-weight:800;letter-spacing:-.02em">{{t.title}}</b>
    <span style="font-size:13.5px;color:var(--muted)">{{t.sub}}</span>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 22px">
    <sc-for list="{{cs}}" as="c" hint-placeholder-count="8">
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:baseline;gap:8px"><b style="font-size:15px">{{c.name}}</b><span style="font-size:12px;color:var(--muted)">{{c.line}}</span></div>
        <div class="{{c.crop}}" style="width:100%;height:270px;font-family:'Heebo',system-ui,sans-serif;color:var(--ink)">
          <div style="padding:14px 12px 0;display:flex;flex-direction:column;gap:8px">
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
              <div style="display:flex;align-items:center;gap:10px;height:52px;padding:0 10px;border-radius:16px;background:var(--raised);box-shadow:0 0 0 1px var(--line-in)">
                <span class="{{r.ptCls}}"><svg class="art" viewBox="0 0 48 48" aria-hidden="true"><path d="{{r.art.d0}}" fill="{{r.art.f0}}"></path><path d="{{r.art.d1}}" fill="{{r.art.f1}}"></path><path d="{{r.art.d2}}" fill="{{r.art.f2}}"></path><path d="{{r.art.d3}}" fill="{{r.art.f3}}"></path><path d="{{r.art.d4}}" fill="{{r.art.f4}}"></path><path d="{{r.art.d5}}" fill="{{r.art.f5}}"></path></svg></span><b class="bidi" style="flex:1;font-size:14px">{{r.name}}</b><span class="qty">{{r.q}}</span>
              </div>
            </sc-for>
          </div>
          <sc-if value="{{c.bubble}}" hint-placeholder-val="{{ false }}"><div class="bubble" style="right:14px;bottom:156px;max-width:200px;font-size:12.5px"><span class="who">Nexus</span>{{t.bubble}}</div></sc-if>
          <sc-if value="{{c.toast}}" hint-placeholder-val="{{ false }}"><div class="toast" style="bottom:88px;height:50px;font-size:13px"><span style="flex:1">{{t.toast}}</span><button class="u">{{t.undo}}</button></div></sc-if>
          <button class="{{c.ask}}" style="{{c.st}}" aria-label="{{t.ask}}">
            <svg class="sp" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z" fill="var(--spark)"></path><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" fill="#fff"></path></svg>
            <sc-if value="{{c.dot}}" hint-placeholder-val="{{ false }}"><span class="dot"></span></sc-if>
          </button>
          <nav class="dock" aria-hidden="true" style="height:68px">
            <span class="tab"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span>
            <span class="tab"><svg viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z M7.5 7.5h.01"></path></svg></span>
            <span class="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14 M5 12h14"></path></svg></span>
            <span class="tab on"><svg viewBox="0 0 24 24"><path d="M5 10l2 10a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l2-10 M3 10h18 M8 10l3-6 M16 10l-3-6"></path></svg></span>
            <span class="tab"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"></path></svg></span>
          </nav>
        </div>
        <div style="font-size:12px;color:var(--muted);line-height:1.45">{{c.how}}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"language":{"editor":"enum","options":["עברית","English"],"default":"עברית"},"motion":{"editor":"enum","options":["full","reduced"],"default":"full"},"$preview":{"width":1330,"height":760}}'>

        const C_ = (x, y, r) => 'M' + (x - r) + ' ' + y + 'a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0z';

    const ART = {

    const t = {
