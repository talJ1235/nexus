# R15 F1 — guards on every push (any branch) and every PR: types, lint, unit tests, the authz / scope / SSRF /
# query-plan guards, the production dependency audit, secret scanning, then a build and the two server checks
# (tenancy with two users + a viewer, security headers + no CSP violations), and the R16 server tests (error log,
# live sync, settings / space look / Home customise). Everything runs on throwaway file
# databases on the runner — no secrets, no remote DB, no AI keys. Actions are pinned by commit SHA.
name: guards
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency: { group: "guards-${{ github.ref }}", cancel-in-progress: true }
env:
  TURSO_DATABASE_URL: file:ci-unit.db
  TURSO_AUTH_TOKEN: ""
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  guards:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 120 # R17: + test:clip (752 + 218 screens), test:auth-flow; S2: admin + onboarding tests; S3: push + inbox; S4: bidi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit --pretty false
      - name: lint
        run: npx eslint --quiet .
      - name: unit tests
        run: |
          for t in sug actions ship budget receipt weekly barcode receipt-check import-vat receipt-track help gestures home reports memory pictures picture-style ics auth otp roles status feed assistant-context short-name ai-quota blocked delete-account notify check-now; do
            echo "::group::test:$t"; npm run -s test:$t; echo "::endgroup::"
          done
      - name: authz coverage · data scope · SSRF · query plans
        run: npm run -s test:authz-coverage && npm run -s test:scope && npm run -s test:ssrf && npm run -s test:query-plans
      - name: dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: build
        run: node scripts/copy-scanic-ml.mjs && npx next build
      - run: npx playwright install --with-deps chromium
      - name: tenancy (users A, B, viewer V on a fresh server; seeded sessions stand in for the IdP)
        run: node scripts/test-tenancy.mjs
      - name: security headers + no CSP violations (closed mode, admin emergency sign-in — R17 E1)
        env:
          CI_DB: file:ci-headers.db
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_EMERGENCY_TOKEN: ci-emergency-token-0123456789abcdef0123
          BETTER_AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
          BETTER_AUTH_URL: http://localhost:3100
          AUTH_FULL_LOCAL: "0"
        run: |
          TURSO_DATABASE_URL=$CI_DB npx tsx src/db/migrate.ts
          TURSO_DATABASE_URL=$CI_DB nohup npx next start -p 3100 > headers-server.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:3100/login && break; sleep 1; done
          BASE=http://localhost:3100 SMOKE_ADMIN_TOKEN=$ADMIN_EMERGENCY_TOKEN SMOKE_ADMIN_EMAIL=$ADMIN_EMAIL node scripts/test-headers.mjs
      - name: Google sign-in — instant feedback, forced 500 / 429 / timeout / offline, Back (R16 G4; Google is stubbed)
        env:
          CI_DB: file:ci-google.db
          ADMIN_EMAIL: ci-admin@example.com
          BETTER_AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
          BETTER_AUTH_URL: http://localhost:3101
          GOOGLE_CLIENT_ID: ci-dummy.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: ci-dummy
          AUTH_FULL_LOCAL: "0"
        run: |
          TURSO_DATABASE_URL=$CI_DB npx tsx src/db/migrate.ts
          TURSO_DATABASE_URL=$CI_DB nohup npx next start -p 3101 > google-server.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:3101/login && break; sleep 1; done
          BASE=http://localhost:3101 node scripts/test-google-signin.mjs
          BASE=http://localhost:3101 node scripts/test-viewport.mjs
      - name: Google in-app sign-in (FedCM sheet via GIS, stubbed) + redirect fallback + ID-token nonce guard (hotfix 2026-10-07)
        env:
          CI_DB: file:ci-fedcm.db
          ADMIN_EMAIL: ci-admin@example.com
          BETTER_AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
          BETTER_AUTH_URL: http://localhost:3102
          GOOGLE_CLIENT_ID: ci-dummy.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: ci-dummy
          AUTH_FULL_LOCAL: "0"
        run: |
          TURSO_DATABASE_URL=$CI_DB npx tsx src/db/migrate.ts
          TURSO_DATABASE_URL=$CI_DB nohup npx next start -p 3102 > fedcm-server.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:3102/login && break; sleep 1; done
          BASE=http://localhost:3102 node scripts/test-google-fedcm.mjs
      - name: error log — limits, redaction, overflow, onRequestError (R16 C2; starts the built app itself)
        run: npm run -s test:errors
      - name: live shared spaces — fake transport + polling, conflicts, presence (R16 B; starts next dev itself)
        run: npm run -s test:live
      - name: polish — worst-case space 0 hydration errors, 0 × 429; R17 A1 loop fade, A2 widgets at every size, A3 Settings from the first frame (starts next dev itself)
        run: npm run -s test:polish
      - name: no cut-off text — every view, Settings section and sheet at 360/390/1366/1280×720, en/he, light/dark, demo + worst-case data (R17 A6; built app)
        run: npm run -s test:clip
      - name: mixed Hebrew + English — Hebrew blocks read RTL, Latin after Hebrew sits to its left; names cut at their end, the switcher's box uncut (R17 P1/P2; built app)
        run: npm run -s test:bidi
      - name: sign-in without a password — emergency path, 410, rate limit (R17 E1, G2 banned sign-in; starts next dev itself)
        run: npm run -s test:auth-flow
      - name: admin panel — 404 for everyone else + every admin action refuses, counts never content (R17 G0; built app)
        run: npm run -s test:admin-access && npm run -s test:admin-privacy
      - name: admin Live — presence on phone + desktop, shopping chip, 75 s, activity counts, requests per 5 s (R17 G1; built app)
        run: npm run -s test:admin-live
      - name: admin People — quota ↔ AI gate, reset, ban, hold to delete, 500 people (R17 G2; built app)
        run: npm run -s test:admin-people
      - name: onboarding — 7 steps, skips, resume, invite / iPhone / standalone (R17 H; built app)
        run: npm run -s test:onboarding
      - name: web push — fake push service + decrypt, 410 / failures, endpoint allow-list, service worker handlers, a real push (R17 S3 J2; built app)
        run: npm run -s test:push
      - name: inbox — popover + phone page, read / mark all / swipe / Received, media inside rows, RTL, the reminder card, Settings → Notifications, budget recipients (R17 S3 K–N; built app)
        run: npm run -s test:inbox
      - name: settings shell, space look, switch moment, Home customise (R16 D1–D5, E1)
        env:
          CI_DB: file:ci-settings.db
          ADMIN_EMAIL: ci-admin@example.com
          BETTER_AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
          BETTER_AUTH_URL: http://localhost:3107
          AUTH_FULL_LOCAL: "0"
          NEXUS_AI_MOCK: "1"
        run: |
          TURSO_DATABASE_URL=$CI_DB npx tsx src/db/migrate.ts
          TURSO_DATABASE_URL=$CI_DB node scripts/seed-local.mjs
          TURSO_DATABASE_URL=$CI_DB nohup npx next start -p 3107 > settings-server.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:3107/login && break; sleep 1; done
          BASE=http://localhost:3107 TURSO_DATABASE_URL=$CI_DB node scripts/test-settings.mjs
      - if: failure()
        run: tail -40 headers-server.log 2>/dev/null || true; tail -40 google-server.log 2>/dev/null || true; tail -40 fedcm-server.log 2>/dev/null || true; tail -40 settings-server.log 2>/dev/null || true
