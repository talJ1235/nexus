# Research probe (manual): which fetch strategies read store pages from datacenter IPs.
name: probe
on:
  workflow_dispatch:
    inputs:
      urls: { description: "Space-separated URLs (optional)", required: false, default: "" }
  push:
    branches: ["probe/**"]
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-extract.mjs ${{ github.event.inputs.urls }} | tee probe-out.txt
        env:
          BASE: https://nexus-ashen-beta.vercel.app
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          VARIANTS: "1"
      # Results committed back to the branch (logs are hard to reach from the agent sandbox).
      - if: always()
        run: |
          git config user.name probe-bot && git config user.email probe@users.noreply.github.com
          git add -f probe-out.txt && git commit -qm "probe results" && git push -qf origin HEAD:refs/heads/probe/results
