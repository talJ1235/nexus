# Free production smoke test: runs on GitHub's servers after every successful Vercel production deploy
# (and on demand). Read-only. GitHub emails the repo owner when it fails; screenshots are attached to the run.
# Setup once: repo Settings → Secrets and variables → Actions → New secret NEXUS_PASSWORD (the site password).
# R15: the smoke signs in through the admin fallback (/login?admin=1, the prod APP_PASSWORD ≥ 20 chars) — the same
# secret, updated on release day together with Vercel's APP_PASSWORD (ROUND15 Part G step 1).
name: smoke
# A deployment_status run gets its "branch" from the deployment's ref — Vercel deploys a commit SHA, so GitHub files the
# run under whichever branch holds that commit (e.g. round16, not main): filter by name / SHA, not by branch.
run-name: "prod smoke · ${{ github.event_name == 'deployment_status' && format('{0} deploy {1}', github.event.deployment.environment, github.event.deployment.sha) || format('manual {0}', github.sha) }}"
on:
  deployment_status:
  workflow_dispatch:
concurrency: { group: smoke, cancel-in-progress: true }
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke.mjs
        env:
          BASE: https://nexus-ashen-beta.vercel.app
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          SMOKE_AI: "1"
          SMOKE_REAL: "1"
          SMOKE_OUT: smoke-shots
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: smoke-shots, path: smoke-shots, if-no-files-found: ignore, retention-days: 7 }
